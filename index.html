.alert.ok{background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20}.alert.ok .a-ic{background:var(--green)}
.alert.err{background:#ffebee;border-color:#ef9a9a;color:#b71c1c}.alert.err .a-ic{background:var(--red)}
.alert.warn{background:#fff8e1;border-color:#ffe082;color:#8d6e00}.alert.warn .a-ic{background:var(--orange)}
.shake{animation:shake .45s}@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.slots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.slot{width:20px;height:20px;border-radius:3px;border:2px dashed #b6c2cf}

.dn-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.dn{width:150px;flex:none}

.vb{display:flex;align-items:flex-end;gap:12px;height:175px;padding:8px 4px 0}

.win-b{padding:18px}.win-f{background:#e4e8ec;border-top:1px solid var(--line2);padding:10px 16px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

.toast.err{border-left-color:var(--red)}.toast.ok{border-left-color:var(--green)}

.empty{padding:32px;text-align:center;color:var(--mut)}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.filter-bar>div{min-width:110px;flex:1}
#vLogin{min-height:100vh;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:26px}

/* ----------- CLIENTE TURSO (vía API proxy) ----------- */
const API_URL = '/api/turso';
async function turso(stmts) {
  const r = await fetch(API_URL, {
    method: 'POST',
    credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ statements: Array.isArray(stmts) ? stmts.map(s => ({ q: s.sql || s.q, params: s.args || s.params || [] })) : [{ q: stmts.sql || stmts.q, params: stmts.args || stmts.params || [] }] })
  });
  if (!r.ok) {
    const txt = await r.text();
    throw new Error('HTTP ' + r.status + ': ' + txt);
  }
  const j = await r.json();
  if (j.error) {
    const errMsg = typeof j.error === 'string' ? j.error : (j.error.message || 'Error Turso');
    throw new Error(errMsg);
  }
  if (Array.isArray(j)) {
    const errItem = j.find(item => item && item.error);
    if (errItem) {
      const msg = typeof errItem.error === 'string' ? errItem.error : (errItem.error.message || 'Error Turso');
      throw new Error(msg);
    }
  }
  return Array.isArray(stmts) ? j : j[0];
}
async function q(sql, args = []) {
  const r = await turso({ sql, args });
  if (!r || !r.results) return [];
  const cols = r.results.columns, rows = r.results.rows;
  return rows.map(row => {
    const o = {};
    cols.forEach((c, i) => { o[c] = row[i]; });
    return o;
  });
}

/* ----------- HASH DE CLAVES (SHA-256 + sal) ----------- */
const SAL = 'c1x10_v1_';
async function hash(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(SAL + pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function parseDate(fn) {
  if (!fn) return null;
  let s = String(fn).trim().replace(/\s+\d{1,2}:\d{2}(:\d{2})?$/, '').replace(/T\d{1,2}:\d{2}(:\d{2})?$/, '');
  if (!s || s === '0' || s === '0000-00-00') return null;
  if (/^\d{3,5}$/.test(s)) {
    const num = parseInt(s, 10);
    if (num >= 1000 && num <= 60000) {
      const ms = (num - 25569) * 86400 * 1000;
      const d = new Date(ms);
      if (!isNaN(d.getTime())) {
        return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() };
      }
    }
  }
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) return { y: parseInt(m[3]), m: parseInt(m[2]), d: parseInt(m[1]) };
  m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if (m) return { y: parseInt(m[1]), m: parseInt(m[2]), d: parseInt(m[3]) };
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2})$/);
  if (m) return { y: 1900 + parseInt(m[3]), m: parseInt(m[2]), d: parseInt(m[1]) };
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (m) return { y: parseInt(m[1]), m: parseInt(m[2]), d: parseInt(m[3]) };
  const b = new Date(s);
  if (!isNaN(b.getTime())) return { y: b.getFullYear(), m: b.getMonth() + 1, d: b.getDate() };
  return null;
}

function edadDe(fn) {
  const o = parseDate(fn);
  if (!o) return 0;
  const now = new Date();
  let e = now.getFullYear() - o.y;
  const diffM = (now.getMonth() + 1) - o.m;
  if (diffM < 0 || (diffM === 0 && now.getDate() < o.d)) e--;
  return (e >= 0 && e <= 120) ? e : 0;
}

function fmtFn(fn) {
  const o = parseDate(fn);

}

function _pdfOpts(title) {

}

function descargarPDFPrevisualizado(html, title, formato='A4') {

}
function sharePDF(elId, title) {
  const el = document.getElementById(elId);
  if (!el) return;
  if (!navigator.share) { toast('Compartir no soportado en este navegador', 'err'); return }
  const tmp = document.createElement('div');
  tmp.style.cssText = 'position:fixed;left:-9999px;top:0;width:800px;font-family:Roboto,Arial,sans-serif;color:#22303e;background:#fff;padding:24px';
  tmp.innerHTML = _pdfHeader(title) + el.innerHTML + _pdfFooter();
  document.body.appendChild(tmp);

async function refreshAll() {
  // Una sola llamada al proxy Turso para todo el snapshot. Antes cada q() abría
  // una petición HTTP independiente y, además, las listas de cada reclutador
  // generaban un N+1. El resultado funcional se mantiene, pero con un único
  // viaje Vercel -> Turso por sincronización.
  const statements = [
    { q: 'SELECT * FROM padron ORDER BY p_apellido, p_nombre' },
    { q: 'SELECT * FROM centros ORDER BY nombre' },
    { q: 'SELECT * FROM reclutadores ORDER BY creado DESC' },
    { q: 'SELECT a.*, u.nombre AS usuario_nom FROM actividad a LEFT JOIN usuarios u ON u.id = a.usuario_id ORDER BY a.id DESC LIMIT 100' },
    { q: 'SELECT * FROM usuarios ORDER BY rol, nombre' },
    { q: 'SELECT cc.*, p.letra, p.p_apellido, p.s_apellido, p.p_nombre, p.s_nombre, p.sexo, p.edad, p.nombre_cv FROM centro_cargos cc LEFT JOIN padron p ON p.cedula = cc.cedula ORDER BY cc.centro_codigo, cc.id' },
    { q: 'SELECT d.id, d.cargo, d.cedula, d.nombre, d.telefono, d.direccion, p.letra, p.p_apellido, p.s_apellido, p.p_nombre, p.s_nombre, p.sexo, p.fecha_nac, p.edad, p.codigo_estado, p.estado, p.codigo_municipio, p.municipio, p.codigo_parroquia, p.parroquia, p.centro_votacion, p.nombre_cv FROM direccion_ejecutiva d LEFT JOIN padron p ON p.cedula = d.cedula ORDER BY d.id DESC' },
    { q: 'SELECT cv.id, cv.comunidad, cv.cargo, cv.cedula, cv.nombre, cv.telefono, cv.direccion, cv.numero_calle, cv.numero_casa, cv.problematica_actual, p.letra, p.p_apellido, p.s_apellido, p.p_nombre, p.s_nombre, p.sexo, p.fecha_nac, p.edad, p.codigo_estado, p.estado, p.codigo_municipio, p.municipio, p.codigo_parroquia, p.parroquia, p.centro_votacion, p.nombre_cv FROM comite_vecinal cv LEFT JOIN padron p ON p.cedula = cv.cedula ORDER BY cv.id DESC' },
    { q: 'SELECT id, categoria, nombre, orden FROM catalogo_problemas WHERE activo = 1 ORDER BY orden, id' },
    { q: 'SELECT cp.comite_id, cp.problema_id, c.categoria, c.nombre AS problema_nombre FROM comite_problemas cp JOIN catalogo_problemas c ON c.id = cp.problema_id ORDER BY cp.comite_id, c.orden, c.id' },
    { q: 'SELECT v.*, p.letra, p.p_apellido, p.s_apellido, p.p_nombre, p.s_nombre, u.nombre AS operador_nom FROM verificaciones_votacion v LEFT JOIN padron p ON p.cedula=v.cedula LEFT JOIN usuarios u ON u.id=v.verificado_por ORDER BY v.verificado_en DESC, v.id DESC' },
    { q: 'SELECT * FROM actas_mesa ORDER BY centro_codigo, mesa' },
    { q: 'SELECT * FROM mesa_operativa ORDER BY centro_codigo, mesa' },
    { q: 'SELECT * FROM mesa_miembros ORDER BY mesa_operativa_id, id' },
    { q: 'SELECT * FROM cortes_electorales ORDER BY tomado_en DESC, id DESC' },
    { q: 'SELECT a.*, p.letra, p.p_apellido, p.s_apellido, p.p_nombre, p.s_nombre, p.sexo, p.fecha_nac, p.edad, p.municipio, p.centro_votacion, p.nombre_cv FROM asignaciones a LEFT JOIN padron p ON p.cedula = a.cedula ORDER BY a.reclutador_id, a.posicion' }
  ];
  const results = await turso(statements);
  const rows = results.map(x => {
    const rr = x?.results || {};
    const cols = rr.columns || [], rows = rr.rows || [];
    return rows.map(row => Object.fromEntries(cols.map((col,i) => [col,row[i]])));
  });
  CACHE.pad = rows[0] || [];
  CACHE.pad.forEach(p => { p.edad = edadDe(p.fecha_nac) || p.edad || 0; });
  CACHE.centros = rows[1] || [];
  CACHE.recl = rows[2] || [];
  CACHE.act = rows[3] || [];
  CACHE.users = rows[4] || [];
  CACHE.cargos = rows[5] || [];
  CACHE.direccion = rows[6] || [];
  CACHE.comite = rows[7] || [];
  CACHE.catalogoProblemas = rows[8] || [];
  CACHE.comiteProblemas = rows[9] || [];
  CACHE.verificacion = rows[10] || [];
  CACHE.actasMesa = rows[11] || [];
  CACHE.mesasOperativas = rows[12] || [];
  CACHE.mesaMiembros = rows[13] || [];
  CACHE.cortes = rows[14] || [];

  // Una sola consulta para todas las asignaciones, agrupada en memoria.
  const asignaciones = rows[15] || [];
  const porReclutador = new Map();
  for (const a of asignaciones) {
    const key = String(a.reclutador_id);
    if (!porReclutador.has(key)) porReclutador.set(key, []);
    porReclutador.get(key).push(a);
  }
  for (const r of CACHE.recl) r.lista = porReclutador.get(String(r.id)) || [];
}

function padBy(c) { const n=normC(c); return CACHE.pad.find(p => normC(p.cedula) === n); }
function cenBy(cod) { return CACHE.centros.find(c => c.codigo === String(cod)); }
function nomP(p) { return ((p.p_nombre || '') + ' ' + (p.s_nombre || '')).trim(); }
function apeP(p) { return ((p.p_apellido || '') + ' ' + (p.s_apellido || '')).trim(); }
function asignDe(c) {
  c = normC(c);
  for (const r of CACHE.recl) {
    if (r.cedula === c) return { tipo: 'reclutador', r };
    const i = r.lista.findIndex(l => l.cedula === c);
    if (i > -1) return { tipo: 'integrante', r, pos: i + 1 };
  }
  return null;
}

async function doLogin() {
  const u = $('lgU').value.trim(), p = $('lgP').value, selR = $('lgR').value;
  if (!u || !p) return toast('Ingrese usuario y clave', 'err');
  try {
    const r = await fetch('/api?route=auth/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify({ usuario: u, clave: p, rol: selR })
    });
    const contentType = r.headers.get('content-type') || '';
    let data = {};
    if (contentType.includes('application/json')) {
      try { data = await r.json(); } catch (e) {}
    } else {
      const raw = await r.text().catch(() => '');
      data = raw ? { error: raw.slice(0, 180) } : {};
    }
    if (!r.ok) return toast((data.error || ('HTTP ' + r.status + ' al autenticar')), 'err', 8000);
    USER = data.user;
    localStorage.setItem('curTab', 'dash');
    await registrarAct('login', 'Inicio de sesión: ' + USER.nombre + ' (' + USER.rol + ')', USER.id);
    await refreshAll();
    enterApp('dash');
  } catch (e) {
    toast('Error de conexión: ' + e.message, 'err', 8000);
  }
}

/* ----------- GRFICAS ----------- */
const PAL = ['#1e88e5', '#43a047', '#fb8c00', '#8e24aa', '#00897b', '#e53935', '#3f51b5', '#fbc02d', '#607d8b', '#00acc1'];
function donut(elId, items, cNum, cLbl) {
  const tot = items.reduce((a, i) => a + i.v, 0) || 1, C = 2 * Math.PI * 62;
  let acc = 0, seg = '';
  items.forEach((it, i) => {
    const len = C * it.v / tot;
    seg += '<circle cx="80" cy="80" r="62" fill="none" stroke="' + it.c + '" stroke-width="19" stroke-dasharray="0 ' + C + '" data-f="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 80 80)" style="transition:stroke-dasharray .9s ' + (i * .07) + 's"/>';
    acc += len;
  });
  $('ch-' + elId).innerHTML = '<div class="dn-wrap"><svg viewBox="0 0 160 160" class="dn">' + seg + '<text x="80" y="77" text-anchor="middle" class="dn-n">' + cNum + '</text><text x="80" y="96" text-anchor="middle" class="dn-l">' + cLbl + '</text></svg><div class="dn-leg">' + items.map(i => '<div class="lg-it"><span class="dt" style="background:' + i.c + '"></span>' + i.l + '<b>' + i.v + '  ' + (100 * i.v / tot).toFixed(1) + '%</b></div>').join('') + '</div></div>';
  setTimeout(() => $('ch-' + elId).querySelectorAll('circle').forEach(c => c.setAttribute('stroke-dasharray', c.dataset.f)), 60);
}
function hbars(elId, items) {
  const mx = Math.max(...items.map(i => i.v), 1);
  $('ch-' + elId).innerHTML = items.map(it => '<div class="hb-row"><span class="lbl">' + esc(it.l) + '</span><div class="hb-track"><div class="hb-fill" data-w="' + (100 * it.v / mx) + '" style="background:' + it.c + '"></div></div><span class="hb-v">' + it.v + '</span></div>').join('');
  setTimeout(() => $('ch-' + elId).querySelectorAll('.hb-fill').forEach(f => f.style.width = f.dataset.w + '%'), 60);
}
function vbars(elId, items) {
  const mx = Math.max(...items.map(i => i.v), 1);
  $('ch-' + elId).innerHTML = '<div class="vb">' + items.map(i => '<div class="vb-col"><span class="vb-v">' + i.v + '</span><div class="vb-bar" data-h="' + (100 * i.v / mx) + '"></div><span class="vb-l">' + i.l + '</span></div>').join('') + '</div>';
  setTimeout(() => $('ch-' + elId).querySelectorAll('.vb-bar').forEach(b => b.style.height = b.dataset.h + '%'), 60);
}
function gauge(elId, pct, num, lbl) {
  const L = Math.PI * 62;
  $('ch-' + elId).innerHTML = '<div style="text-align:center"><svg viewBox="0 0 160 96" style="width:185px"><path d="M 18 88 A 62 62 0 0 1 142 88" fill="none" stroke="#dfe4ea" stroke-width="16" stroke-linecap="round"/><path d="M 18 88 A 62 62 0 0 1 142 88" fill="none" stroke="#123c69" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 ' + L + '" data-f="' + (L * pct).toFixed(1) + '" style="transition:stroke-dasharray 1s"/><text x="80" y="72" text-anchor="middle" class="dn-n">' + num + '</text><text x="80" y="90" text-anchor="middle" class="dn-l">' + lbl + '</text></svg></div>';
  setTimeout(() => { const p = $('ch-' + elId).querySelector('path[data-f]'); p.setAttribute('stroke-dasharray', p.dataset.f) }, 60);
}

async function verificarDuplicidadPersona(cedula, contexto = '') {
  const ced = normC(cedula);
  if (!ced) return null;

  const consultas = await Promise.all([
    q('SELECT id, cedula, estructura, direccion FROM reclutadores WHERE cedula = ?', [ced]),
    q('SELECT a.id, a.cedula, a.reclutador_id, a.posicion, r.cedula AS reclutador_cedula, r.estructura FROM asignaciones a LEFT JOIN reclutadores r ON r.id = a.reclutador_id WHERE a.cedula = ?', [ced]),
    q('SELECT id, cargo, cedula FROM direccion_ejecutiva WHERE cedula = ?', [ced]),
    q('SELECT id, comunidad, cedula FROM comite_vecinal WHERE cedula = ?', [ced]),
    q('SELECT id, centro_codigo, cargo, cedula FROM centro_cargos WHERE cedula = ?', [ced])
  ]);

  const encontrados = [];
  if (consultas[0].length) encontrados.push({ tipo: 'MOVILIZADOR', detalle: 'ya está registrado como movilizador.' });
  if (consultas[1].length) {
    const a = consultas[1][0];
    const pRecl = padBy(a.reclutador_cedula);
    const nombreRecl = pRecl ? (nomP(pRecl) + ' ' + apeP(pRecl)).trim() : ('C.I. ' + fC('V', a.reclutador_cedula || ''));
    encontrados.push({
      tipo: 'COMPROMETIDO',
      detalle: 'ya pertenece a la lista de Comprometidos del movilizador ' + nombreRecl + '.',
      reclutador_id: a.reclutador_id,
      reclutador_nombre: nombreRecl,
      posicion: a.posicion
    });
  }
  if (consultas[2].length) {
    const d = consultas[2][0];
    encontrados.push({ tipo: 'DIRECCIÓN EJECUTIVA', detalle: 'ya ocupa el cargo "' + (d.cargo || '') + '" en Dirección Ejecutiva.' });
  }
  if (consultas[3].length) {
    const cv = consultas[3][0];
    encontrados.push({ tipo: 'COMITÉ VECINAL', detalle: 'ya está asignado a la comunidad "' + (cv.comunidad || '') + '".' });
  }
  if (consultas[4].length) {
    const cc = consultas[4][0];
    encontrados.push({ tipo: 'CARGO DE CENTRO', detalle: 'ya ocupa el cargo "' + (cc.cargo || '') + '" en el centro "' + (cc.centro_codigo || '') + '".' });
  }
  if (!encontrados.length) return null;

  const destino = (() => {
    const c = String(contexto || '').toLowerCase();
    if (c.includes('moviliz')) return 'MOVILIZADOR';
    if (c.includes('comprom')) return 'COMPROMETIDO';
    if (c.includes('direccion')) return 'DIRECCIÓN EJECUTIVA';
    if (c.includes('comite')) return 'COMITÉ VECINAL';
    if (c.includes('cargo')) return 'CARGO DE CENTRO';
    return String(contexto || 'OTRO').toUpperCase();
  })();

  const incompatibles = encontrados.filter(d => d.tipo !== destino);
  if (!incompatibles.length) return encontrados[0];

  const detalle = incompatibles.map(d => d.detalle).join(' ');
  const autorizado = await autorizarDuplicidadPersona(ced, destino, incompatibles);
  if (!autorizado) return {
    ...incompatibles[0],
    detalle: detalle + ' Se requiere autorización de Jefe de Comando o Administrador para registrarla además como ' + destino + '.'
  };
  return null;
}

async function verificarDuplicidadTelefono(telefono, exclude = {}) {
  const tel = String(telefono || '').replace(/\D/g, '');
  if (!tel) return null;

  const filas = await q(`
    SELECT 'USUARIO' AS origen, id, telefono, NULL AS cedula, nombre AS descripcion FROM usuarios WHERE telefono IS NOT NULL AND telefono != ''
    UNION ALL
    SELECT 'MOVILIZADOR', id, telefono, cedula, estructura FROM reclutadores WHERE telefono IS NOT NULL AND telefono != ''
    UNION ALL
    SELECT 'COMPROMETIDO', a.id, a.telefono, a.cedula, CAST(a.reclutador_id AS TEXT) FROM asignaciones a WHERE a.telefono IS NOT NULL AND a.telefono != ''
    UNION ALL
    SELECT 'DIRECCIÓN EJECUTIVA', id, telefono, cedula, cargo FROM direccion_ejecutiva WHERE telefono IS NOT NULL AND telefono != ''
    UNION ALL
    SELECT 'COMITÉ VECINAL', id, telefono, cedula, comunidad FROM comite_vecinal WHERE telefono IS NOT NULL AND telefono != ''
    UNION ALL
    SELECT 'CARGO DE CENTRO', id, telefono, cedula, cargo FROM centro_cargos WHERE telefono IS NOT NULL AND telefono != ''
  `);
  const found = filas.find(x => {
    if (String(x.telefono || '').replace(/\D/g, '') !== tel) return false;
    return !(exclude.origen && String(x.origen) === String(exclude.origen) && String(x.id) === String(exclude.id));
  });
  return found || null;
}

function mensajeDuplicidadTelefono(telefono, dup) {
  const t = normTel(telefono);
  let extra = '';
  if (dup.origen === 'COMPROMETIDO') {
    const reclId = Number(dup.descripcion);
    const r = CACHE.recl.find(x => x.id === reclId);
    const p = r ? padBy(r.cedula) : null;
    const nombre = p ? (nomP(p) + ' ' + apeP(p)).trim() : (r ? r.cedula : '');
    extra = nombre ? ' en la lista del movilizador ' + nombre : '';
  } else if (dup.origen === 'MOVILIZADOR') {
    const p = padBy(dup.cedula);
    extra = p ? ' en el movilizador ' + (nomP(p) + ' ' + apeP(p)).trim() : '';
  } else if (dup.descripcion) {
    extra = ' (' + String(dup.descripcion) + ')';
  }
  return '⛔ Teléfono duplicado: el número ' + t + ' ya está registrado en ' + dup.origen + extra + '. No se permite repetir números telefónicos en ningún módulo del sistema.';
}

function renderPadron() {

  const f = PADF;
  const all = CACHE.pad.filter(p => {
    if (f.txt) { const q = f.txt.toLowerCase(), cq = normC(f.txt); if (!((cq.length >= 3 && p.cedula.includes(cq)) || (nomP(p) + ' ' + apeP(p)).toLowerCase().includes(q))) return false }

    if (f.centro && p.centro_votacion !== f.centro) return false;
    if (f.e1 && (edadDe(p.fecha_nac) || p.edad || 0) < +f.e1) return false;

async function assignCargo(codigo, idx, cedula, tel, dir, padron) {

  const dupGlobal = await verificarDuplicidadPersona(cedula, 'cargo');
  if (dupGlobal) return toast(mensajeDuplicidadPersona(cedula, dupGlobal), 'err', 8000);
  const p = padBy(cedula);

  if (p && p.centro_votacion && (p.centro_votacion !== codigo && p.nombre_cv !== (targetCen ? targetCen.nombre : ''))) {
    return toast('⛔ Asignación rechazada: La persona C.I. ' + fC(p.letra, cedula) + ' está asignada en el Padrón CNE al centro "' + (p.nombre_cv || p.centro_votacion) + '". No se puede asignar a un centro distinto (' + (targetCen ? targetCen.nombre : codigo) + ').', 'err', 8000);
  }

        const rr = await fetch('/api/personas/asignar-cargo',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo:'centro',centro_codigo:codigo,cargo,cedula,telefono:tel?normTel(tel):'',direccion:dir,padron:padron||undefined})});

function expRep() {

function parseCSV(txt) {
  const lines = String(txt || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const dl = [';', ',', '\t'].map(d => lines[0].split(d).length);
  const d = [';', ',', '\t'][dl.indexOf(Math.max(...dl))];
  return lines.map(l => l.split(d).map(x => x.replace(/^"|"$/g, '').trim()));
}
function readFile(inp) {
  const f = inp.files[0]; if (!f) return;
  const ext = f.name.split('.').pop().toLowerCase();
  if (['xlsx', 'xls'].includes(ext)) {
    const rd = new FileReader();
    rd.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        processRows(data, f.name);
      } catch (err) { toast('Error al leer Excel: ' + err.message, 'err', 6000) }
    };
    rd.readAsArrayBuffer(f);
  } else {
    const rd = new FileReader();
    rd.onload = () => { processRows(parseCSV(rd.result), f.name) };
    rd.readAsText(f);
  }
  inp.value = '';
}
function processRows(raw, fname) {
  let h = -1;
  for (let i = 0; i < Math.min(raw.length, 5); i++) { const up = raw[i].map(x => String(x).toUpperCase().replace(/\./g, '')); if (up.includes('CEDULA_IDENTIDAD')) { h = i; break } }
  const head = h > -1 ? raw[h].map(x => String(x).toUpperCase().replace(/\./g, '')) : null;
  const idx = n => head ? head.indexOf(n) : -1;
  const ci = idx('CEDULA_IDENTIDAD') > -1 ? idx('CEDULA_IDENTIDAD') : 1;
  const rows = raw.filter((r, i) => i > h && r.some(c => c && String(c).trim())).filter(r => { const c = normC(String(r[ci] || '')); return c.length >= 5 && /^\d+$/.test(c) });
  const get = (r, n, pos) => { const v = idx(n) > -1 ? r[idx(n)] : r[pos]; return v != null ? String(v) : '' };
  const normFecha = s => {
    s = String(s || '').trim().replace(/\s+\d{1,2}:\d{2}(:\d{2})?$/, '').replace(/T\d{1,2}:\d{2}(:\d{2})?$/, '');
    if (!s || s === '0') return '';
    let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if (m) return m[3] + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0');
    m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
    if (m) return m[1] + '-' + m[2].padStart(2,'0') + '-' + m[3].padStart(2,'0');
    m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2})$/);
    if (m) return '19' + m[3] + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0');
    m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    return s.slice(0, 10);
  };
  const out = []; const cenMap = {};
  rows.forEach(r => {
    const ced = normC(get(r, 'CEDULA_IDENTIDAD', 1)); if (!ced) return;
    out.push({
      letra: get(r, 'LETRA_CEDULA', 0).toUpperCase() || 'V', ced,
      pa: get(r, 'P_APELLIDO', 2), sa: get(r, 'S_APELLIDO', 3),
      pn: get(r, 'P_NOMBRE', 4), sn: get(r, 'S_NOMBRE', 5),
      sexo: get(r, 'SEXO', 6).toUpperCase().startsWith('M') ? 'M' : 'F',
      fn: normFecha(get(r, 'FECHA_NACIMIENTO', 7)),
      codEst: get(r, 'CODIGO_ESTADO', 8), estado: get(r, 'ESTADO', 9),
      codMun: get(r, 'CODIGO_MUNICIPIO', 10), mun: get(r, 'MUNICIPIO', 11),
      codPar: get(r, 'CODIGO_PARROQUIA', 12), par: get(r, 'PARROQUIA', 13),
      cvCod: get(r, 'CENTRO_VOTACION', 14), cvNom: get(r, 'NOMBRE_CV', 15)
    });
    if (!cenMap[out[out.length - 1].cvCod]) { cenMap[out[out.length - 1].cvCod] = out[out.length - 1] }
  });
  if (!out.length) { toast('No se encontraron electores vlidos en el archivo', 'err', 5000); return }
  const mun = [...new Set(out.map(p => p.mun).filter(Boolean))];
  const par = [...new Set(out.map(p => p.par).filter(Boolean))];
  window._impData = { out, cenMap, fname };
  win(ic('file', 18) + ' Vista previa  ' + esc(fname),
    '<div class="grid g2" style="gap:8px;margin-bottom:10px"><div class="ck-it"><b>' + out.length + '</b><span>Electores</span></div><div class="ck-it"><b>' + Object.keys(cenMap).length + '</b><span>Centros</span></div><div class="ck-it"><b>' + mun.length + '</b><span>Municipios</span></div><div class="ck-it"><b>' + par.length + '</b><span>Parroquias</span></div></div>' +
    '<div style="max-height:260px;overflow-y:auto;border:1px solid var(--line2);border-radius:4px"><table class="tbl"><thead><tr><th>C.I.</th><th>Apellidos</th><th>Nombres</th><th>Edad</th><th>Sexo</th><th>Centro</th><th>Municipio</th></tr></thead><tbody>' + out.slice(0, 15).map(p => '<tr><td class="mono">' + fC(p.letra, p.ced) + '</td><td>' + esc(p.pa + ' ' + p.sa) + '</td><td>' + esc(p.pn + ' ' + p.sn) + '</td><td>' + edadDe(p.fn) + '</td><td>' + p.sexo + '</td><td>' + esc(p.cvNom) + '</td><td>' + esc(p.mun) + '</td></tr>').join('') + (out.length > 15 ? '<tr><td colspan="7" style="text-align:center;color:#999;font-style:italic">... +' + (out.length - 15) + ' registros ms</td></tr>' : '') + '</tbody></table></div>',
    '<button class="btn btn-w" onclick="closeModal()">Cancelar</button><button class="btn btn-navy" onclick="applyImp()">' + ic('up', 14) + ' Cargar al padrón</button>', 720);
}
function applyImp() {
  const { out, cenMap, fname } = window._impData; if (!out) return;
  (async () => {
    try {
      const CHUNK = 400;
      const progDiv = document.createElement('div');
      progDiv.id = 'uploadProg';
      progDiv.style.cssText = 'position:fixed;inset:0;background:rgba(18,60,105,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:400;color:#fff';
      document.body.appendChild(progDiv);
      const setProg = (msg, pct) => { progDiv.innerHTML = '<div class="spinner" style="width:44px;height:44px;border:4px solid rgba(255,255,255,.25);border-top-color:#ffca28;border-radius:50%;animation:spin 1s linear infinite"></div><p style="margin-top:16px;font-size:15px;font-weight:600">' + msg + '</p><div style="width:280px;height:8px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:12px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:#ffca28;border-radius:4px;transition:width .3s"></div></div>' };
      closeModal();
      let centroids = Object.values(cenMap).filter(c => !cenBy(c.cvCod)).map(c => ({ codigo: c.cvCod, nombre: c.cvNom, municipio: c.mun, parroquia: c.par, estado: c.estado, mesas: 1, cod_estado: c.codEst, cod_municipio: c.codMun, cod_parroquia: c.codPar }));
      if (centroids.length) {
        setProg('Centros electorales...', 0);
        for (let i = 0; i < centroids.length; i += CHUNK) {
          /* Persistencia centralizada en /api/padron/gestionar. */
          setProg('Centros electorales... ' + Math.min(i + CHUNK, centroids.length), 5);
        }
        await refreshAll();
      }
      const toAdd = out.filter(p => !padBy(p.ced));
      if (!toAdd.length) { progDiv.remove(); toast('Todos los electores ya existen en el padrón', 'ok'); return }
      let loaded = 0;
      const total = toAdd.length;
      for (let i = 0; i < total; i += CHUNK) {
        const rr=await fetch('/api/padron/gestionar',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'importar',rows:toAdd.slice(i,i+CHUNK),centros:i===0?Object.values(cenMap):[],fname})}); const rd=await rr.json().catch(()=>({})); if(!rr.ok) throw new Error(rd.error||'No se pudo cargar el padrón');
        loaded += Math.min(CHUNK, total - loaded);
        setProg('Cargando electores... ' + loaded + ' / ' + total, Math.round(100 * loaded / total));
      }
      setProg('Carga completa. Actualizando...', 100);
      await registrarAct('sys', 'Padrón CNE: +' + total + ' nuevos • ' + (fname || ''), USER.id);
      await refreshAll();
      $('hdrInfo').innerHTML = 'Usuario: ' + esc(USER.nombre.toUpperCase()) + ' • <span class="yel">TURSO • ' + CACHE.pad.length + ' electores  ' + CACHE.recl.length + ' movilizadores</span>';
      progDiv.remove();
      toast('? ' + total + ' electores cargados', 'ok', 5000);
      go('dash');
    } catch (e) { const p = document.getElementById('uploadProg'); if (p) p.remove(); toast('Error: ' + e.message, 'err', 8000); console.error(e) }
  })();
}

            if (['J','A'].includes(USER.rol)) { const rr=await fetch('/api/padron/gestionar',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reparar_edades'})}); const rd=await rr.json().catch(()=>({})); if(!rr.ok) throw new Error(rd.error||'No se pudieron reparar las edades'); }
            await refreshAll();
          }
          clearTimeout(progressTimer);
          $('loading').style.display = 'none';
          enterApp(localStorage.getItem('curTab') || 'dash');
          return;
        }
      }
    } catch (e) {
      console.warn('No se pudo verificar la sesión:', e);
    }

    clearTimeout(progressTimer);
    $('lgInfo').textContent = Number(bj.padron_count || 0) + ' electores • Base de datos lista';
    $('loading').style.display = 'none';
    $('vLogin').style.display = 'flex';
  } catch (e) {
    clearTimeout(progressTimer);
    setLoad('Error al preparar el sistema', e.message || 'Revise la configuración del backend');
    $('loading').style.display = 'none';
    $('vLogin').style.display = 'flex';
    $('lgInfo').textContent = 'Error de conexión';
    console.error(e);
  }
})();

async function saveDirAuto(cedula) {
  cedula = normC(cedula);
  const cargoSelect = $('dirCargo');
  const cargo = cargoSelect ? cargoSelect.value.trim() : '';

    if (cargoSelect) { cargoSelect.style.border = '2px solid var(--red)'; cargoSelect.focus(); }
    return toast('Por favor seleccione un Cargo en el desplegable superior', 'err');
  }
  const tel = ($('dirTel') ? $('dirTel').value : '').trim();
  const dir = ($('dirDir') ? $('dirDir').value : '').trim();
  if (tel && !valTel(tel)) return toast('Teléfono inválido. Use formato 0XXX-XXXXXXX', 'err');
  if (tel) { const dupTel = await verificarDuplicidadTelefono(tel); if (dupTel) return toast(mensajeDuplicidadTelefono(tel, dupTel), 'err', 8000); }

  const dupGlobal = await verificarDuplicidadPersona(cedula, 'direccion');
  if (dupGlobal) return toast(mensajeDuplicidadPersona(cedula, dupGlobal), 'err', 8000);

  const p = padBy(cedula);
  const nomComp = p ? (apeP(p) + ', ' + nomP(p)) : cedula;

  try {
    const rr = await fetch('/api/personas/asignar-cargo',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo:'direccion',cedula,cargo,nombre:nomComp,telefono:tel?normTel(tel):'',direccion:dir})});
    const data = await rr.json().catch(()=>({})); if(!rr.ok) throw new Error(data.error||'No se pudo asignar el cargo');
    await registrarAct('user', 'Asignado a Dirección Ejecutiva: ' + nomComp + ' ➔ ' + cargo, USER.id);
    await refreshAll();
    renderDireccion();
    closeModal();
    toast('Cargo "' + cargo + '" asignado exitosamente', 'ok');
  } catch (e) {
    console.error('Error guardando Dirección Ejecutiva:', e);
    toast('Error al guardar: ' + e.message, 'err');
  }
}

async function saveDirManualFull() {
  const cargoSelect = $('dirCargo');
  const cargo = cargoSelect ? cargoSelect.value.trim() : '';
  if (!cargo) {
    if (cargoSelect) { cargoSelect.style.border = '2px solid var(--red)'; cargoSelect.focus(); }
    return toast('Por favor seleccione un Cargo en el desplegable superior', 'err');
  }

  const ced = normC($('dmCed').value), letra = $('dmLet').value;
  const pa = $('dmPa').value.trim(), sa = $('dmSa').value.trim();
  const pn = $('dmPn').value.trim(), sn = $('dmSn').value.trim();
  const sexo = $('dmSex').value, fn = $('dmFn').value;
  const cvCod = $('dmCv').value;
  const tel = ($('dmTel') ? $('dmTel').value : '').trim();
  const dir = ($('dmDir') ? $('dmDir').value : '').trim();

  if (!/^\d{5,9}$/.test(ced)) return toast('Cédula inválida (debe tener entre 5 y 9 dígitos)', 'err');
  if (!pa || !pn) return toast('Complete el primer apellido y primer nombre', 'err');
  if (tel && !valTel(tel)) return toast('Teléfono inválido. Use formato 0XXX-XXXXXXX', 'err');
  if (tel) { const dupTel = await verificarDuplicidadTelefono(tel); if (dupTel) return toast(mensajeDuplicidadTelefono(tel, dupTel), 'err', 8000); }

  const dupGlobal = await verificarDuplicidadPersona(ced, 'direccion');
  if (dupGlobal) return toast(mensajeDuplicidadPersona(ced, dupGlobal), 'err', 8000);

  const cv = cenBy(cvCod) || CACHE.centros[0] || {};
  const p = padBy(ced);
  if (p && p.centro_votacion && (p.centro_votacion !== cvCod && p.nombre_cv !== cv.nombre)) {
    return toast('⛔ Registro rechazado: La persona C.I. V-' + ced + ' ya pertenece en el Padrón CNE al centro "' + (p.nombre_cv || p.centro_votacion) + '". No se acepta el registro manual en un centro distinto (' + (cv.nombre || cvCod) + ').', 'err', 8000);
  }
  const edad = edadDe(fn);

  try {
    const nomComp = pa + (sa ? ' ' + sa : '') + ', ' + pn + (sn ? ' ' + sn : '');
    const rr = await fetch('/api/personas/asignar-cargo',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo:'direccion',cedula:ced,cargo,nombre:nomComp,telefono:tel?normTel(tel):'',direccion:dir,padron:{cedula:ced,letra,p_apellido:pa,s_apellido:sa,p_nombre:pn,s_nombre:sn,sexo,fecha_nac:fn,edad,codigo_estado:cv.cod_estado,codigo_municipio:cv.cod_municipio,codigo_parroquia:cv.cod_parroquia,estado:cv.estado,municipio:cv.municipio,parroquia:cv.parroquia,centro_votacion:cv.codigo,nombre_cv:cv.nombre}})});
    const data = await rr.json().catch(()=>({})); if(!rr.ok) throw new Error(data.error||'No se pudo asignar el cargo');

    await registrarAct('user', 'Alta manual Dirección Ejecutiva: ' + fC(letra, ced) + ' ➔ ' + cargo, USER.id);
    await refreshAll();
    renderDireccion();
    closeModal();
    toast('Registrado exitosamente en Dirección Ejecutiva', 'ok');
  } catch (e) {
    console.error('Error en registro manual Dirección Ejecutiva:', e);
    toast('Error al guardar: ' + e.message, 'err');
  }
}

  win('Editar Dirección Ejecutiva — ' + esc(reg.cargo),

async function saveDirEdit(id) {
  const tel = $('dirETel').value.trim(), dir = $('dirEDir').value.trim();
  if (tel && !valTel(tel)) return toast('Teléfono inválido. Use formato 0XXX-XXXXXXX', 'err');
  if (tel) { const dupTel = await verificarDuplicidadTelefono(tel, {origen:'DIRECCIÓN EJECUTIVA', id}); if (dupTel) return toast(mensajeDuplicidadTelefono(tel, dupTel), 'err', 8000); }
  try {
    const rr=await fetch('/api/direccion/gestionar',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'editar',id,cargo,telefono:tel,direccion:dir})}); const rd=await rr.json().catch(()=>({})); if(!rr.ok) throw new Error(rd.error||'No se pudo actualizar');

}

function controlCentroActual() {

function controlPersonasCentro(codigo) {
  const rows = [];
  const seen = new Set();
  const centro = cenBy(codigo) || {};
  const coincideCentro = p => {
    if (!codigo) return true;
    const pc = String(p?.centro_votacion || '');
    const pn = String(p?.nombre_cv || '');
    return pc === String(codigo) || pn === String(centro.nombre || '');
  };
  const agregar = (cedula, p, meta) => {
    const ced = normC(cedula);
    if (!ced || seen.has(ced) || !coincideCentro(p)) return;
    seen.add(ced);
    rows.push({
      l: { cedula: ced },
      p: p || { cedula: ced },
      reclutador: meta.reclutador || null,
      posicion: meta.posicion || null,
      origen: meta.origen || 'PADRÓN CNE',
      cargo: meta.cargo || ''
    });
  };

  // Las funciones/cargos son metadatos de la persona, no un requisito
  // para poder verificarla. Primero incorporamos quienes ya tienen
  // estructura registrada para conservar su origen/cargo en pantalla.
  for (const r of CACHE.recl || []) {
    const pr = padBy(r.cedula) || r;
    agregar(r.cedula, pr, {
      origen: 'MOVILIZADOR',
      cargo: 'Movilizador',
      reclutador: r
    });
    for (let i = 0; i < (r.lista || []).length; i++) {
      const l = r.lista[i];
      const p = padBy(l.cedula) || l;
      agregar(l.cedula, p, {
        origen: '1×10',
        cargo: 'Comprometido',
        reclutador: r,
        posicion: i + 1
      });
    }
  }

  for (const d of CACHE.direccion || []) {
    const p = padBy(d.cedula) || d;
    agregar(d.cedula, p, {
      origen: 'DIRECCIÓN EJECUTIVA',
      cargo: d.cargo || 'Cargo'
    });
  }

  for (const cv of CACHE.comite || []) {
    const p = padBy(cv.cedula) || cv;
    agregar(cv.cedula, p, {
      origen: 'COMITÉ VECINAL',
      cargo: 'Responsable • ' + (cv.comunidad || 'Comité Vecinal')
    });
  }

  for (const cc of CACHE.cargos || []) {
    if (String(cc.centro_codigo) !== String(codigo)) continue;
    const p = padBy(cc.cedula) || cc;
    agregar(cc.cedula, p, {
      origen: 'CARGO DE CENTRO',
      cargo: cc.cargo || 'Cargo de centro'
    });
  }

  // Regla única de Verificación Electoral: todo elector que figure en el
  // padrón CNE del centro seleccionado puede ser buscado y verificado,
  // tenga o no tenga un cargo/función registrado en el sistema.
  for (const p of CACHE.pad || []) {
    if (!coincideCentro(p)) continue;
    agregar(p.cedula, p, {
      origen: 'PADRÓN CNE',
      cargo: ''
    });
  }

  return rows;
}
function controlVerif(cedula, centroCodigo) {
  const c = centroCodigo == null ? '' : String(centroCodigo);
  return (CACHE.verificacion || []).find(v =>
    normC(v.cedula) === normC(cedula) &&
    (!c || String(v.centro_codigo || '') === c)
  ) || null;
}
function controlMesaTexto(v) {
  return v ? String(v.mesa || '') : '';
}
function origenRegistroPersona(cedula) {
  const c = normC(cedula);
  const cargo = (CACHE.cargos || []).find(x => normC(x.cedula) === c);
  if (cargo) return 'Cargo de centro: ' + (cargo.cargo || 'Sin cargo');
  const dir = (CACHE.direccion || []).find(x => normC(x.cedula) === c);
  if (dir) return 'Dirección Ejecutiva: ' + (dir.cargo || 'Sin cargo');
  const com = (CACHE.comite || []).find(x => normC(x.cedula) === c);
  if (com) return 'Comité Vecinal: ' + (com.comunidad || 'Sin comunidad');
  const movil = (CACHE.recl || []).find(x => normC(x.cedula) === c);
  if (movil) return 'Movilizador';
  for (const rr of (CACHE.recl || [])) {
    const a = (rr.lista || []).find(x => normC(x.cedula) === c);
    if (a) return '1×10 • ' + nomP(padBy(rr.cedula) || rr);
  }
  return padBy(c) ? 'Padrón CNE' : 'Registro existente';
}


function datosUltimaVerificacion(cedula) {
  const c = normC(cedula);
  const pad = padBy(c);
  const candidatos = [];
  const personas = [];

  if (pad) personas.push(pad);

  // 1×10 tiene prioridad absoluta y se presenta como Comprometido.
  for (const rr of (CACHE.recl || [])) {
    const a = (rr.lista || []).find(x => normC(x.cedula) === c);
    if (a) {
      candidatos.push('Comprometido');
      personas.push(a, padBy(rr.cedula) || rr);
      break;
    }
  }

  if (!candidatos.length) {
    for (const cc of (CACHE.cargos || [])) {
      if (normC(cc.cedula) === c) {
        if (cc.cargo) candidatos.push(String(cc.cargo));
        personas.push(cc);
      }
    }
    for (const d of (CACHE.direccion || [])) {
      if (normC(d.cedula) === c) {
        if (d.cargo) candidatos.push(String(d.cargo));
        personas.push(d);
      }
    }
    for (const cv of (CACHE.comite || [])) {
      if (normC(cv.cedula) === c) {
        candidatos.push('Comité Vecinal' + (cv.comunidad ? ' • ' + String(cv.comunidad) : ''));
        personas.push(cv);
      }
    }
    for (const r of (CACHE.recl || [])) {
      if (normC(r.cedula) === c) {
        candidatos.push('Movilizador');
        personas.push(r);
      }
    }
  }

  // La función debe ser determinista: nunca seleccionar un cargo al azar.
  // Prioridad: 1×10 (Comprometido) > cargo de centro > Dirección Ejecutiva >
  // Comité Vecinal > Movilizador > Adicional.
  const cargo = candidatos.length ? candidatos[0] : 'Adicional';

  const p = personas.find(x =>
    x && ((x.p_nombre || x.p_apellido || x.s_apellido || x.s_nombre) || x.letra)
  ) || pad || {};

  return { p, cargo };
}

function metricasCorteCentro(codigo) {
  const centro = cenBy(codigo);
  if (!centro) return null;
  const personas = controlPersonasCentro(codigo);
  const verificados = personas.filter(x => !!controlVerif(x.l.cedula, codigo));
  const mM = personas.filter(x => x.p.sexo === 'M').length;
  const mF = personas.filter(x => x.p.sexo === 'F').length;
  const vM = verificados.filter(x => x.p.sexo === 'M').length;
  const vF = verificados.filter(x => x.p.sexo === 'F').length;
  const mesas = Math.max(1, Number(centro.mesas || 1));
  const detalle = [];
  for (let i=1;i<=mesas;i++) {
    const mesa=String(i);
    const vv=verificados.filter(x => controlMesaTexto(controlVerif(x.l.cedula, codigo))===mesa).length;
    const acta=(CACHE.actasMesa||[]).find(a=>a.centro_codigo===codigo && String(a.mesa)===mesa);
    detalle.push({mesa, verificados:vv, votos_partido:acta ? Number(acta.votos_partido||0) : null, diferencia:acta ? vv-Number(acta.votos_partido||0) : null});
  }
  const actasCargadas=detalle.filter(x=>x.votos_partido!==null).length;
  const totalActa=detalle.reduce((a,x)=>a+(x.votos_partido===null?0:x.votos_partido),0);
  const verifConActa=detalle.filter(x=>x.votos_partido!==null).reduce((a,x)=>a+x.verificados,0);
  return {personas:personas.length,verificados:verificados.length,pendientes:Math.max(0,personas.length-verificados.length),pct:personas.length?verificados.length/personas.length*100:0,mM,mF,vM,vF,mesas,actasCargadas,totalActa,diffTotal:actasCargadas?verifConActa-totalActa:null,detalle};
}

async function crearCorteElectoral(codigo) {
  const centro=cenBy(codigo);
  if(!centro) return toast('Seleccione un centro válido para tomar el corte','err');
  const etiqueta=prompt('Etiqueta del corte (opcional):','Corte '+new Date().toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'}));
  if(etiqueta===null) return;
  try {
    const rr=await fetch('/api/cortes',{
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({centro_codigo:String(codigo),etiqueta:etiqueta.trim()})
    });
    const data=await rr.json().catch(()=>({}));
    if(!rr.ok) throw new Error(data.error||'No se pudo guardar el corte');
    await refreshAll();
    renderControlElectoral();
    toast('Corte registrado correctamente','ok');
  }catch(e){toast('No se pudo guardar el corte: '+e.message,'err',8000);}
}

function abrirVerificacion(cedula) {
  const centro=controlCentroActual();
  if(!centro) return toast('Seleccione un centro válido', 'err');
  const persona=controlPersonasCentro(centro.codigo).find(x=>normC(x.l.cedula)===normC(cedula));
  if(!persona) return toast('La persona no aparece en el padrón CNE del centro seleccionado', 'err');
  const v=controlVerif(cedula, centro.codigo);
  if(v) return toast('La persona ya aparece como VOTÓ en este centro • Mesa '+v.mesa, 'err');
  const p=persona.p||{};
  win(ic('check',18)+' Verificación de asistencia',
    '<div class="alert ok" style="margin-top:0"><span class="uava">'+ini(apeP(p)+' '+nomP(p))+'</span><div><b>'+esc(apeP(p)+', '+nomP(p))+'</b><div class="mono">'+esc(fC(p.letra||'V',cedula))+'</div></div></div>' +
    '<div style="margin-top:14px"><label class="fl" style="font-size:14px">MESA <span style="color:var(--red)">*</span></label><input class="inp mono" id="ctlMesaInput" value="'+esc(v?v.mesa:'')+'" placeholder="Escriba el número de mesa" inputmode="text" autofocus></div>' +
    '<div style="margin-top:10px;font-size:12px;color:var(--mut)">Al confirmar se registrará individualmente la asistencia, la mesa indicada y la hora de verificación. La persona queda controlada aunque pertenezca a 1×10, Movilizadores, Comité Vecinal, Dirección Ejecutiva o un cargo del centro.</div>',
    '<button class="btn btn-w" onclick="closeModal()">Cancelar</button><button class="btn btn-g" onclick="guardarVerificacion(\''+esc(cedula)+'\')">'+ic('check',14)+' '+(v?'Actualizar verificación':'Marcar VOTÓ')+'</button>',520
  );
  setTimeout(()=>{const el=$('ctlMesaInput');if(el){el.focus();el.select()}},120);
}
async function guardarVerificacion(cedula) {
  const centro=controlCentroActual(), mesa=String($('ctlMesaInput')?.value||'').trim();
  if(!centro) return toast('Seleccione un centro', 'err');
  if(!mesa) return toast('Ingrese el número de Mesa', 'err');

  const persona=controlPersonasCentro(centro.codigo).find(x=>normC(x.l.cedula)===normC(cedula));
  if(!persona) return toast('La persona no aparece en el padrón CNE del centro seleccionado', 'err');

  try {
    const r=await fetch('/api/verificaciones', {
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        cedula:normC(cedula),
        centro_codigo:centro.codigo,
        mesa
      })
    });
    let data={};
    try{data=await r.json()}catch(e){}
    if(!r.ok) return toast(data.error||'No se pudo guardar la verificación','err',8000);

    await refreshAll();
    closeModal();
    renderControlElectoral();
    toast('Asistencia verificada • VOTÓ • Mesa '+mesa,'ok',6000);
  } catch(e) {
    console.error(e);
    toast('No se pudo guardar la verificación: '+e.message,'err',8000);
  }
}

async function guardarControlMesa(codigo,mesa){
  const chk=$('mesaConstituida_'+mesa), hora=$('mesaHora_'+mesa);
  const test=document.querySelector('input[name="mesaTestigos_'+mesa+'"]:checked');
  const constituida=!!chk?.checked, hc=hora?.value||'';
  const actual=mesaOperativa(codigo,mesa);
  if(actual?.hora_constitucion) return toast('La constitución de esta mesa ya fue guardada y no puede modificarse','err');
  if(constituida&&!hc) return toast('Seleccione manualmente la hora de constitución','err');
  if(!constituida&&hc){ if(hora) hora.value=''; return toast('Si la mesa no está constituida, no debe registrar hora','err'); }
  try{
    const rr=await fetch('/api/mesas/miembros',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'control',centro_codigo:codigo,mesa:String(mesa),constituida:constituida?'SI':'NO',hora_constitucion:hc,testigos_asistieron:test?.value||'NO'})});
    const d=await rr.json().catch(()=>({})); if(!rr.ok) throw new Error(d.error||'No se pudo guardar el control de mesa');
    // Bloqueo inmediato en pantalla: la constitución es irreversible desde el
    // momento en que el backend confirma el guardado, sin esperar a refreshAll().
    if (chk) chk.disabled = true;
    if (hora) hora.disabled = true;
    document.querySelectorAll('input[name="mesaTestigos_'+mesa+'"]').forEach(el => { el.disabled = true; });
    const btn = $('mesaGuardar_'+mesa);
    if (btn) btn.disabled = true;
    await refreshAll(); renderControlElectoral();
    toast('Control de Mesa guardado','ok');
  }catch(e){toast('Error guardando control de mesa: '+e.message,'err',8000);}
}

function mesaOperativa(codigo, mesa) {
  return (CACHE.mesasOperativas || []).find(x => String(x.centro_codigo) === String(codigo) && String(x.mesa) === String(mesa)) || null;
}
function mesaMiembros(codigo, mesa) {
  const mo = mesaOperativa(codigo, mesa);
  return mo ? (CACHE.mesaMiembros || []).filter(x => Number(x.mesa_operativa_id) === Number(mo.id)) : [];

function catalogoCargosMesa(codigo,mesa) {

  const testigos=[
    {cargo:'Testigo Principal Mesa '+n,cedula:null,persona:null},
    {cargo:'Testigo Suplente Mesa '+n,cedula:null,persona:null}
  ];
  const source=getCargosCentro(codigo);
  return [...base,...testigos].map(k=>{

function estadoSlotMesa(codigo,mesa,cargo) {
  const ms=mesaMiembros(codigo,mesa);
  const accidental=ms.find(m=>m.tipo==='ACCIDENTAL'&&String(m.cargo)===String(cargo));
  if(accidental) return {estado:'REEMPLAZADO',miembro:accidental};
  const titular=ms.find(m=>m.tipo==='AFECTO'&&String(m.cargo)===String(cargo));

  return {estado:'AUSENTE',miembro:null};
}

async function guardarActaMesa(codigo, mesa) {
  const val=Number($('actaPartidoInput')?.value);
  if(!Number.isInteger(val)||val<0) return toast('Ingrese una cantidad válida de votos del partido','err');

  try {
    const r=await fetch('/api/actas', {
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        centro_codigo:codigo,
        mesa:String(mesa),
        votos_partido:val
      })
    });
    let data={};
    try{data=await r.json()}catch(e){}
    if(!r.ok) return toast(data.error||'No se pudo guardar el acta','err',8000);

    await refreshAll();
    closeModal();
    renderControlElectoral();
    toast(data.accion==='actualizada'?'Acta actualizada':'Acta guardada','ok');
  } catch(e) {
    console.error(e);
    toast('Error guardando acta: '+e.message,'err',8000);
  }
}

async function saveComiteManualFull() {

    if (comSelect) { comSelect.style.border = '2px solid var(--red)'; comSelect.focus(); }
    return toast('Por favor seleccione una Comunidad en el desplegable superior', 'err');
  }

  const cargoEl=$('comCargo'); const cargo=cargoEl ? cargoEl.value.trim() : '';
  if (!cargo) return toast('Seleccione el cargo que ocupará la persona', 'err');
  const ced = normC($('cmCed').value), letra = $('cmLet').value;
  const pa = $('cmPa').value.trim(), sa = $('cmSa').value.trim();
  const pn = $('cmPn').value.trim(), sn = $('cmSn').value.trim();
  const sexo = $('cmSex').value, fn = $('cmFn').value;
  const cvCod = $('cmCv').value;
  const tel = ($('cmTel') ? $('cmTel').value : '').trim();
  const dir = ($('cmDir') ? $('cmDir').value : '').trim();
  const nroCalle = ($('cmNroCalle') ? $('cmNroCalle').value : '').trim();
  const nroCasa = ($('cmNroCasa') ? $('cmNroCasa').value : '').trim();
  const problematica = ($('cmProblematica') ? $('cmProblematica').value : '').trim();
  const problemas = selectedComiteProblemas('cm');

  if (!/^\d{5,9}$/.test(ced)) return toast('Cédula inválida (debe tener entre 5 y 9 dígitos)', 'err');
  if (!pa || !pn) return toast('Complete el primer apellido y primer nombre', 'err');
  if (tel && !valTel(tel)) return toast('Teléfono inválido. Use formato 0XXX-XXXXXXX', 'err');
  if (tel) { const dupTel = await verificarDuplicidadTelefono(tel); if (dupTel) return toast(mensajeDuplicidadTelefono(tel, dupTel), 'err', 8000); }

  const dupGlobal = await verificarDuplicidadPersona(ced, 'comite');
  if (dupGlobal) return toast(mensajeDuplicidadPersona(ced, dupGlobal), 'err', 8000);

  const cv = cenBy(cvCod) || CACHE.centros[0] || {};
  const p = padBy(ced);
  if (p && p.centro_votacion && (p.centro_votacion !== cvCod && p.nombre_cv !== cv.nombre)) {
    return toast('⛔ Registro rechazado: La persona C.I. V-' + ced + ' ya pertenece en el Padrón CNE al centro "' + (p.nombre_cv || p.centro_votacion) + '". No se acepta el registro manual en un centro distinto (' + (cv.nombre || cvCod) + ').', 'err', 8000);
  }
  const edad = edadDe(fn);

  try {
    const nomComp = pa + (sa ? ' ' + sa : '') + ', ' + pn + (sn ? ' ' + sn : '');
    const rr=await fetch('/api/comite/gestionar',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'guardar',comunidad,cargo,cedula:ced,letra,p_apellido:pa,s_apellido:sa,p_nombre:pn,s_nombre:sn,sexo,fecha_nac:fn,telefono:tel,numero_calle:nroCalle,numero_casa:nroCasa,direccion,problematica,centro_codigo:cvCod})});
    const rd=await rr.json().catch(()=>({})); if(!rr.ok) throw new Error(rd.error||'No se pudo registrar el comité');
    if(rd.id) await guardarProblemasComite(rd.id, problemas);
    await refreshAll();
    renderComite();
    closeModal();
    toast('Registrado exitosamente en Comité Vecinal', 'ok');
  } catch (e) {
    console.error('Error en registro manual Comité Vecinal:', e);
    toast('Error al guardar: ' + e.message, 'err');
  }
}

function getComiteListadoCompleto() {
  const asignados=CACHE.comite||[], cargos=['COORDINADOR','RESPONSABLE DE ORGANIZACIÓN','RESPONSABLE ELECTORAL','RESPONSABLE DE JUVENTUD','RESPONSABLE DE ACCIÓN SOCIAL'];
  const porClave=new Map();
  asignados.forEach(r=>porClave.set(String(r.comunidad||'').trim().toUpperCase()+'|'+String(r.cargo||'').trim().toUpperCase(),r));
  const out=[];
  getComunidadesCatalogo().forEach((comunidad,i)=>{
    cargos.forEach(cargo=>{
      const asignado=porClave.get(String(comunidad).trim().toUpperCase()+'|'+cargo)||null;
      const p=asignado?(padBy(asignado.cedula)||asignado):{};
      out.push({nro:i+1,comunidad,cargo,asignado,p,estado:asignado?'ASIGNADO':'SIN ASIGNAR'});
    });
  });
  return out;
}

function datosComiteFila(item) {
  const x = item.asignado;
  const p = item.p || {};
  const ci = x ? fC(p.letra || x.letra || 'V', x.cedula) : '';
  const pa = p.p_apellido || '';
  const sa = p.s_apellido || '';
  const pn = p.p_nombre || '';
  const sn = p.s_nombre || '';
  const nombre = x ? (x.nombre || ((pa || sa) ? (apeP(p) + ', ' + nomP(p)) : x.cedula)) : '';
  const edad = x ? ((edadDe(p.fecha_nac) || (p.edad !== undefined && p.edad !== null ? p.edad : '')) || '') : '';
  const sexo = x ? (p.sexo || '') : '';
  const fn = x ? fmtFn(p.fecha_nac) : '';
  const cv = x ? (p.nombre_cv || p.centro_votacion || '') : '';
  const munPar = x ? ((p.municipio || '') + (p.parroquia ? ' / ' + p.parroquia : '')) : '';
  const tel = x ? (x.telefono || p.telefono || '') : '';
  const dir = x ? (x.direccion || p.direccion || '') : '';
  const nroCalle = x ? (x.numero_calle || '') : '';
  const nroCasa = x ? (x.numero_casa || '') : '';
  const legacyProblem = x ? (x.problematica_actual || '') : '';
  const catalogProblems = x ? problemasTextoComite(x.id) : '';
  const problematica = [catalogProblems, legacyProblem ? 'Observación: ' + legacyProblem : ''].filter(Boolean).join(' • ');
  return { ci, pa, sa, pn, sn, nombre, edad, sexo, fn, cv, munPar, tel, dir, nroCalle, nroCasa, problematica };
}
