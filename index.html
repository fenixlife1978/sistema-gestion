<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#123c69;--navy-d:#0d2f52;--navy-l:#1a4f8a;--bg:#e8ebee;--line:#c9d2dc;--line2:#d9dee4;--txt:#22303e;--mut:#5c6b7a;--yel:#ffca28;--green:#43a047;--red:#e53935;--teal:#00897b;--orange:#fb8c00;--blue:#1e88e5}
body{font:14px/1.45 Roboto,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#b9c4d0;border-radius:6px}
.mono{font-family:Consolas,monospace}button{font-family:inherit}
#hdr{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 22px}
.hdr-l{display:flex;align-items:center;gap:14px;min-width:0}
#hdr h1{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .sub{font-size:12.5px;color:#c8d4e2;margin-top:2px}
.hdr-r{text-align:right;flex:none}
#clock{font-size:16.5px;font-weight:700}
#hdrInfo{font-size:12.5px;color:#e6ecf2;margin-top:2px}
.yel{color:var(--yel)}
#toolbar{background:#fdfdfe;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;padding:8px 14px 6px;flex-wrap:wrap;gap:2px;position:relative}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;cursor:pointer;padding:6px 8px 5px;border-radius:4px;min-width:70px;font-size:11.5px;color:#3c4854}
.tb:hover{background:#eef2f6}.tb .g{height:30px;display:grid;place-items:center}
#moreMenu{position:fixed;right:12px;top:140px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 26px rgba(15,40,70,.22);border-radius:8px;display:none;z-index:200;min-width:240px}
#moreMenu.on{display:block}#moreMenu button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 14px;font-size:13px;cursor:pointer;border-radius:6px}
#moreMenu button:hover{background:#eef3f8}#moreMenu hr{border:0;border-top:1px solid var(--line2)}
#tabs{background:var(--navy);display:flex;padding:6px 10px 0;gap:2px;overflow-x:auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 15px 8px;background:var(--navy);color:#d9e2ec;border:1px solid var(--navy-d);border-bottom:0;border-radius:6px 6px 0 0;cursor:pointer;font-size:13px;min-width:96px;white-space:nowrap}
.tab:hover{background:var(--navy-l)}.tab.on{background:var(--bg);color:var(--navy);font-weight:700;border-color:var(--line)}
#main{padding:16px 20px 60px}
.sec{display:none}.sec.on{display:block;animation:secIn .25s}@keyframes secIn{from{opacity:0;transform:translateY(6px)}}
.panel{border:1px solid var(--line);border-radius:4px;background:#fbfcfd;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,40,70,.07)}
.panel-h{background:linear-gradient(#f8fafc,#e3e9f0);border-bottom:1px solid var(--line);padding:9px 16px;color:var(--navy);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-b{padding:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.gC{grid-template-columns:330px 1fr}
label.fl{color:var(--navy);font-weight:700;font-size:12.5px;display:block;margin-bottom:5px}
.inp{width:100%;background:#fff;border:1px solid #c6ccd4;border-radius:4px;padding:9px 12px;font:14px Roboto;color:var(--txt);outline:none}
.inp:focus{border-color:var(--navy-l);box-shadow:0 0 0 3px rgba(26,79,138,.15)}
.btn{border-radius:4px;padding:9px 16px;font-weight:700;font-size:13px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:active{transform:scale(.97)}.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-l)}
.btn-w{background:#fff;border-color:#c6ccd4;color:#333}.btn-w:hover{background:#f1f4f8}
.btn-red{background:var(--red);color:#fff}.btn-g{background:var(--green);color:#fff}.btn-xs{padding:5px 10px;font-size:12px}.btn-big{padding:12px 20px;font-size:14.5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:700;border:1px solid}
.chip-g{background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20}.chip-r{background:#ffebee;border-color:#ef9a9a;color:#b71c1c}
.chip-y{background:#fff8e1;border-color:#ffe082;color:#8d6e00}.chip-b{background:#e3f2fd;border-color:#90caf9;color:#0d47a1}
.chip-t{background:#e0f2f1;border-color:#80cbc4;color:#00695c}.chip-gr{background:#eceff1;border-color:#cfd8dc;color:#455a64}
.kcard{background:#fdfdfd;border:1px solid var(--line2);border-radius:8px;padding:13px 16px;min-width:0;overflow:hidden}
.kcard .kl{color:var(--navy);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard .kv{font-size:26px;font-weight:700;color:var(--navy);margin:3px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kcard .ks{color:var(--mut);font-size:12px}
.pbar{height:8px;background:#dfe4ea;border-radius:3px;overflow:hidden;margin-top:8px}.pbar i{display:block;height:100%;background:var(--navy);transition:width .7s}.pbar i.full{background:var(--green)}
.tbl{width:100%;border-collapse:collapse;background:#fff}
.tbl th{background:linear-gradient(#f8fafc,#e6ebf1);color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:8px 9px;border:1px solid var(--line2)}
.tbl td{padding:7px 9px;border:1px solid #e2e7ec;font-size:12.5px}
.tbl tbody tr:hover{background:#eef4fa}
.pager{display:flex;gap:5px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.pg{min-width:30px;height:30px;border-radius:4px;border:1px solid #c6ccd4;background:#fff;cursor:pointer;font-weight:700;font-size:12px}
.pg.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.alert{border:1px solid;border-radius:4px;padding:12px 14px;margin-top:12px;display:flex;gap:12px;font-size:13.5px;animation:secIn .3s}
.alert .a-ic{flex:none;width:34px;height:34px;border-radius:4px;display:grid;place-items:center;color:#fff}
.alert b{display:block;margin-bottom:3px;font-size:14px}
.alert.ok{background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20}.alert.ok .a-ic{background:var(--green)}
.alert.err{background:#ffebee;border-color:#ef9a9a;color:#b71c1c}.alert.err .a-ic{background:var(--red)}
.alert.warn{background:#fff8e1;border-color:#ffe082;color:#8d6e00}.alert.warn .a-ic{background:var(--orange)}
.shake{animation:shake .45s}@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.slots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.slot{width:20px;height:20px;border-radius:3px;border:2px dashed #b6c2cf}
.slot.f{border-style:solid;background:var(--green);border-color:var(--green);animation:pop .35s}@keyframes pop{from{transform:scale(.4)}}
.ring{transform:rotate(-90deg)}.ring .bg{stroke:#dfe4ea}.ring .fg{stroke-linecap:round;transition:stroke-dashoffset .8s}
.row10{display:flex;gap:9px;align-items:center;padding:9px 10px;border:1px solid var(--line2);border-radius:4px;margin-bottom:8px;background:#fff}
.row10.empty{border-style:dashed;background:#f6f8fa;color:var(--mut);justify-content:center;font-size:12.5px}
.pos{width:26px;height:26px;border-radius:4px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.ck{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin:12px 0}
.ck-it{background:#fff;border:1px solid var(--line2);border-radius:4px;padding:10px 12px}
.ck-it b{font-size:18px;font-weight:700;color:var(--navy);display:block}.ck-it span{font-size:11px;color:var(--mut)}
.rec-sel{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--line2);border-radius:4px;background:#fff;cursor:pointer;text-align:left;width:100%}
.rec-sel:hover{background:#eef4fa}.rec-sel.on{border-color:var(--navy);background:#e8f0f8;box-shadow:inset 3px 0 0 var(--navy)}
.uava{width:36px;height:36px;border-radius:4px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.feed-it{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #e2e7ec;font-size:13px}
.feed-it:last-child{border:0}.feed-it time{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.dn-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.dn{width:150px;flex:none}
.dn-n{font:700 25px Roboto;fill:var(--navy)}.dn-l{font:500 8.5px Roboto;fill:var(--mut);letter-spacing:.1em}
.dn-leg{display:grid;gap:6px;font-size:12.5px;color:var(--mut)}
.lg-it{display:flex;align-items:center;gap:8px}.lg-it b{color:var(--txt);margin-left:auto;padding-left:10px;font-family:Consolas,monospace;font-size:11.5px}
.dt{width:10px;height:10px;border-radius:2px;flex:none}
.hb-row{display:grid;grid-template-columns:minmax(100px,170px) 1fr 44px;gap:9px;align-items:center;margin-bottom:10px;font-size:12.5px}
.hb-row .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.hb-track{height:15px;background:#dfe4ea;border-radius:3px;overflow:hidden}
.hb-fill{height:100%;width:0;border-radius:3px;transition:width .9s}
.hb-v{font-family:Consolas,monospace;font-size:11.5px;text-align:right;color:var(--mut)}
.vb{display:flex;align-items:flex-end;gap:12px;height:175px;padding:8px 4px 0}
.vb-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.vb-bar{width:68%;max-width:50px;border-radius:3px 3px 0 0;background:var(--teal);height:0;transition:height .9s}
.vb-v{font:700 12px Consolas,monospace;color:var(--navy)}.vb-l{font-size:10.5px;color:var(--mut);font-weight:700}
.stack{display:flex;height:26px;border-radius:3px;overflow:hidden;margin:6px 0}.stack i{transition:width .9s}
.stack-lg{display:flex;gap:16px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}.stack-lg b{color:var(--txt)}
#mOv{position:fixed;inset:0;background:rgba(10,25,45,.5);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow:auto;padding:36px 18px}
#mOv.on{display:flex}
.win{background:#f2f4f6;border:1px solid #8fa0b2;box-shadow:0 20px 55px rgba(5,20,40,.45);border-radius:4px;width:720px;max-width:100%;animation:winIn .22s}
@keyframes winIn{from{opacity:0;transform:translateY(-14px)}}
.win-h{background:var(--navy);color:#fff;padding:9px 16px;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:10px}
.win-h .x{margin-left:auto;background:none;border:0;color:#fff;font-size:17px;cursor:pointer}
.win-b{padding:18px}.win-f{background:#e4e8ec;border-top:1px solid var(--line2);padding:10px 16px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:5px solid var(--navy);padding:11px 14px;border-radius:4px;min-width:280px;max-width:380px;font-size:13px;box-shadow:0 10px 26px rgba(15,40,70,.25);animation:tIn .3s}
.toast.err{border-left-color:var(--red)}.toast.ok{border-left-color:var(--green)}
.toast.bye{opacity:0;transform:translateX(30px);transition:.4s}@keyframes tIn{from{opacity:0;transform:translateX(40px)}}
.dz{border:2px dashed #b9c4d0;border-radius:4px;padding:22px;text-align:center;cursor:pointer;background:#f7f9fb;color:var(--mut)}
.dz:hover{border-color:var(--navy-l);background:#eef3f8;color:var(--navy)}
.fmt{font-family:Consolas,monospace;font-size:11px;background:#eef2f6;color:var(--navy);border:1px solid var(--line2);border-radius:4px;padding:10px 12px;overflow:auto;white-space:pre;margin-top:10px}
.empty{padding:32px;text-align:center;color:var(--mut)}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.filter-bar>div{min-width:110px;flex:1}
#vLogin{min-height:100vh;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:26px}
.lg-win{width:470px;max-width:100%;background:#f2f4f6;border:1px solid #0a2a4c;box-shadow:0 26px 60px rgba(0,0,0,.5);border-radius:6px;overflow:hidden}
.lg-h{background:var(--navy-d);color:#fff;padding:16px 20px;display:flex;gap:14px;align-items:center}
.lg-h h1{font-size:20px;font-weight:700}.lg-h p{font-size:12px;color:#c8d4e2}
.lg-b{padding:22px}
.qchips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.qchip{display:flex;gap:9px;align-items:center;background:#fff;border:1px solid var(--line2);border-radius:4px;padding:8px 10px;cursor:pointer;text-align:left;font-size:12px}
.qchip:hover{border-color:var(--navy-l);background:#eef3f8}
.qchip b{display:block;font-size:12px}.qchip span{color:var(--mut);font-size:10.5px}
#loading{position:fixed;inset:0;background:rgba(18,60,105,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;color:#fff}
#loading .spinner{width:52px;height:52px;border:4px solid rgba(255,255,255,.25);border-top-color:#ffca28;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{margin-top:22px;font-size:16px;text-align:center;padding:0 20px}
#loading .sub{font-size:12px;color:#c8d4e2;margin-top:8px;text-align:center;padding:0 30px}
@media(max-width:1100px){.g3,.g4{grid-template-columns:1fr 1fr}.g2,.gC{grid-template-columns:1fr}}
@media(max-width:760px){.g3,.g4{grid-template-columns:1fr}#hdr{flex-direction:column;align-items:flex-start}.hdr-r{text-align:left}}
@media print{#toolbar,#tabs,.hdr-r,#toasts,#mOv{display:none!important}body{background:#fff}#main{padding:0}.panel{box-shadow:none;border:1px solid #ddd;break-inside:avoid}.panel-h{background:var(--navy)!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{border:1px solid #ccc;padding:6px 8px;font-size:11px}.tbl th{background:var(--navy)!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.kcard{border:1px solid #ddd;break-inside:avoid}.empty{display:none!important}.btn{display:none!important}.chip{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media print{.print-only{display:block!important}.no-print{display:none!important}}
.print-only{display:none}
.pdf-header{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:16px}
.pdf-header h1{font-size:18px;color:var(--navy);flex:1}
.pdf-header .meta{font-size:10px;color:#666;text-align:right}
.pdf-footer{margin-top:20px;padding-top:10px;border-top:2px solid var(--navy);font-size:9px;color:#888;display:flex;justify-content:space-between}
</style>
<style>
html,body{width:100%;overflow-x:hidden;max-width:100vw}
#hdr{overflow:hidden;min-width:0}
.hdr-l{min-width:0;overflow:hidden}
#hdr h1{font-size:clamp(14px,2.5vw,22px)}
#hdrInfo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toolbar{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
#tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#main{padding:14px 12px 60px;overflow-x:hidden}
.panel-h{overflow:hidden}
.filter-bar{gap:8px}.filter-bar>div{min-width:90px}
.panel-b{overflow-x:auto}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gC{grid-template-columns:1fr}
.g2,.g3,.g4{grid-template-columns:1fr}
@media(min-width:761px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.gC{grid-template-columns:330px 1fr}}
@media(max-width:600px){#hdr{padding:10px 12px;gap:10px}#hdr h1{font-size:15px}#clock{font-size:14px}#hdrInfo{font-size:11px}.tab{min-width:0;padding:6px 10px;font-size:11.5px}#main{padding:10px 8px 50px}.panel-b{padding:10px}.kcard{padding:10px}.filter-bar{flex-direction:column}.filter-bar>div{min-width:0;flex:1 1 100%}.btn{padding:7px 12px;font-size:12px}.qchips{grid-template-columns:1fr}.win{max-width:96vw}.kcard h3{font-size:14px}.kcard .kv{font-size:18px}.inp{max-width:100%}}
@media(max-width:900px){.filter-bar{flex-wrap:wrap}.filter-bar>div{min-width:120px;flex:1 1 45%}.kcard{padding:10px 12px}.kcard .kv{font-size:20px}}
</style>
</head>
<body>

<div id="loading">
 <div class="spinner"></div>
 <p id="loadMsg">Inicializando base de datos Turso...</p>
 <div class="sub" id="loadSub">Creando esquema y migrando data CNE</div>
</div>

<div id="vLogin" style="display:none"><div class="lg-win">
 <div class="lg-h"><span id="lgShield"></span><div><h1>GESTIÓN DE CAMPAÑA</h1><p>Partido Político · Yaracuy · Sistema Electoral</p></div></div>
 <div class="lg-b">
  <label class="fl">Usuario</label><input class="inp" id="lgU" placeholder="usuario" autocomplete="username">
  <label class="fl" style="margin-top:12px">Clave</label><input class="inp" id="lgP" type="password" placeholder="••••••••" autocomplete="current-password">
  <button class="btn btn-navy btn-big" style="width:100%;justify-content:center;margin-top:16px" onclick="doLogin()">Ingresar al sistema →</button>
  <div class="qchips" id="qchips"></div>
  <p style="font-size:11.5px;color:var(--mut);text-align:center;margin-top:12px">Conectado a Turso · <span id="lgInfo">—</span></p>
 </div></div></div>

<div id="vApp" style="display:none">
 <header id="hdr">
  <div class="hdr-l"><span id="hdrShield"></span><div><h1>GESTIÓN DE CAMPAÑA</h1><div class="sub">Partido Político · Yaracuy · Base de datos en la nube (Turso)</div></div></div>
  <div class="hdr-r"><div id="clock">--:--:--</div><div id="hdrInfo">Usuario: — · <span class="yel">…</span></div></div>
 </header>
 <div id="toolbar">
  <button class="tb" onclick="tbSave()"><span class="g" id="gSave"></span>Guardar</button>
  <button class="tb" onclick="tbEdit()"><span class="g" id="gEdit"></span>Editar</button>
  <button class="tb" onclick="tbDel()"><span class="g" id="gDel"></span>Eliminar</button>
  <button class="tb" onclick="window.print()"><span class="g" id="gPrint"></span>Imprimir</button>
  <button class="tb" onclick="openSearch()"><span class="g" id="gSearch"></span>Buscar</button>
  <button class="tb" onclick="refreshAll();go(CUR)"><span class="g" id="gRef"></span>Actualizar</button>
  <button class="tb" onclick="openHist()"><span class="g" id="gHist"></span>Historial</button>
  <button class="tb" onclick="openDocs()"><span class="g" id="gDocs"></span>Documentos</button>
  <button class="tb" onclick="openNotes()"><span class="g" id="gNotes"></span>Notas</button>
  <button class="tb" onclick="openAlerts()"><span class="g" id="gBell"></span>Alertas</button>
  <button class="tb" onclick="go('padron')"><span class="g" id="gCne"></span>Padrón CNE</button>
  <button class="tb" onclick="toggleMore()"><span class="g" id="gMore"></span>Más Opciones</button>

/* ═══════════ CLIENTE TURSO (vía API proxy) ═══════════ */
const API_URL = '/api/turso';
async function turso(stmts) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ statements: Array.isArray(stmts) ? stmts.map(s => ({ q: s.sql || s.q, params: s.args || s.params || [] })) : [{ q: stmts.sql || stmts.q, params: stmts.args || stmts.params || [] }] })
  });
  if (!r.ok) throw new Error('API error ' + r.status);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return Array.isArray(stmts) ? j : j[0];
}
async function q(sql, args = []) {
  const r = await turso({ sql, args });
  if (!r || !r.results) return [];
  const cols = r.results.columns, rows = r.results.rows;
  return rows.map(row => {
    const o = {};
    cols.forEach((c, i) => { o[c] = row[i]; });
    return o;
  });
}
async function x(sql, args = []) { return turso({ sql, args }); }

/* ═══════════ HASH DE CLAVES (SHA-256 + sal) ═══════════ */
const SAL = 'c1x10_v1_';
async function hash(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(SAL + pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const normC = s => String(s || '').replace(/\D/g, '');
const _focused = () => document.activeElement ? document.activeElement.id : null;
const _refocus = id => { if (id) { const el = $(id); if (el) { el.focus(); const v = el.value; el.value = ''; el.value = v; } } };
const fC = (l, c) => { c = String(c); let o = ''; for (let i = c.length - 1, k = 0; i >= 0; i--, k++) { if (k && k % 3 === 0) o = '.' + o; o = c[i] + o } return (l || 'V') + '-' + o };
const two = n => String(n).padStart(2, '0');
const hhmm = ts => { const d = new Date(ts); return two(d.getHours()) + ':' + two(d.getMinutes()) };
const tAgo = ts => { const m = Math.max(0, Math.round((Date.now() - ts) / 60000)); if (m < 1) return 'ahora'; if (m < 60) return 'hace ' + m + ' min'; const h = Math.round(m / 60); if (h < 24) return 'hace ' + h + ' h'; return 'hace ' + Math.round(h / 24) + ' d' };
const ini = n => String(n).trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const edadDe = fn => { if (!fn) return 0; const b = new Date(fn), t = new Date(); let e = t.getFullYear() - b.getFullYear(); const m = t.getMonth() - b.getMonth(); if (m < 0 || (m === 0 && t.getDate() < b.getDate())) e--; return e };

function _pdfFooter() {
  return '<div style="margin-top:16px;padding-top:8px;border-top:2px solid #123c69;font-size:8.5px;color:#888;display:flex;justify-content:space-between">' +
    '<span>Gestión de Campaña — ERP Electoral</span><span>Generado: ' + new Date().toLocaleString('es-VE') + '</span></div></div>';
}
function _pdfTable(headers, rows) {
  let h = '<table style="width:100%;border-collapse:collapse;font-size:10px;margin-top:8px"><thead><tr>';
  headers.forEach(c => { h += '<th style="background:#123c69;color:#fff;padding:5px 6px;text-align:left;font-weight:600;border:1px solid #0d2f52">' + c + '</th>' });
  h += '</tr></thead><tbody>';
  rows.forEach((row, i) => {
    const bg = i % 2 === 0 ? '#fff' : '#f4f6f9';
    h += '<tr style="background:' + bg + '">';
    row.forEach((c, j) => { h += '<td style="padding:4px 6px;border:1px solid #ddd;vertical-align:top">' + (c === null || c === undefined ? '—' : c) + '</td>' });
    h += '</tr>';
  });
  h += '</tbody></table>';
  return h;
}
function printSection(elId, title) {
  const el = document.getElementById(elId);
  if (!el) return;
  const w = window.open('', '_blank');
  w.document.write('<!DOCTYPE html><html><head><title>' + esc(title) + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">' +

    '.tbl{width:100%;border-collapse:collapse;font-size:10.5px}.tbl th{background:#123c69;color:#fff;padding:6px 8px;text-align:left;border:1px solid #0d2f52}' +
    '.tbl td{padding:5px 7px;border:1px solid #ddd}.tbl tr:nth-child(even){background:#f4f6f9}' +
    '.chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9.5px;font-weight:600}' +
    '.chip-b{background:#e3f2fd;color:#1565c0}.chip-g{background:#e8f5e9;color:#2e7d32}.chip-gr{background:#f1f3f4;color:#5c6b7a}.chip-r{background:#ffebee;color:#c62828}.chip-y{background:#fff8e1;color:#f57f17}' +

  setTimeout(() => { w.print(); w.close(); }, 400);
}
function downloadPDF(elId, title) {
  const el = document.getElementById(elId);
  if (!el) return;
  const tmp = document.createElement('div');
  tmp.style.cssText = 'position:fixed;left:-9999px;top:0;width:800px;font-family:Roboto,Arial,sans-serif;color:#22303e;background:#fff;padding:24px';
  tmp.innerHTML = _pdfHeader(title) + el.innerHTML + _pdfFooter();
  document.body.appendChild(tmp);
  toast('Generando PDF...', 'info');
  html2pdf().set(_pdfOpts(title)).from(tmp).save().then(() => {
    document.body.removeChild(tmp);
    toast('PDF descargado', 'ok');
  }).catch(() => { document.body.removeChild(tmp); toast('Error al generar PDF', 'err') });
}
function sharePDF(elId, title) {
  const el = document.getElementById(elId);
  if (!el) return;
  if (!navigator.share) { toast('Compartir no soportado en este navegador', 'err'); return }
  const tmp = document.createElement('div');
  tmp.style.cssText = 'position:fixed;left:-9999px;top:0;width:800px;font-family:Roboto,Arial,sans-serif;color:#22303e;background:#fff;padding:24px';
  tmp.innerHTML = _pdfHeader(title) + el.innerHTML + _pdfFooter();
  document.body.appendChild(tmp);
  html2pdf().set({ ..._pdfOpts(title), returnTemp: true }).from(tmp).outputPdf('blob').then(blob => {
    document.body.removeChild(tmp);
    const file = new File([blob], title.replace(/[^a-z0-9]/gi, '_') + '.pdf', { type: 'application/pdf' });
    navigator.share({ title: title, text: 'Gestión de Campaña — ' + title, files: [file] }).catch(() => toast('Cancelado', 'err'));
  }).catch(() => { document.body.removeChild(tmp); toast('Error al generar PDF', 'err') });
}
function buildActionBtns(elId, title) {
  return '<div class="no-print" style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">' +
    '<button class="btn btn-w btn-xs" onclick="printSection(\'' + elId + '\',\'' + esc(title) + '\')">' + ic('file', 13) + ' Imprimir</button>' +
    '<button class="btn btn-navy btn-xs" onclick="downloadPDF(\'' + elId + '\',\'' + esc(title) + '\')">' + ic('dl', 13) + ' Descargar PDF</button>' +
    '<button class="btn btn-w btn-xs" onclick="sharePDF(\'' + elId + '\',\'' + esc(title) + '\')">' + ic('bolt', 13) + ' Compartir</button></div>';
}

function toast(msg, type, ms) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || '');
  t.innerHTML = '<span style="color:' + (type === 'err' ? 'var(--red)' : type === 'ok' ? 'var(--green)' : 'var(--navy)') + '">' + ic(type === 'err' ? 'warn' : type === 'ok' ? 'check' : 'bolt', 16) + '</span><div>' + msg + '</div>';
  $('toasts').appendChild(t);
  setTimeout(() => { t.classList.add('bye'); setTimeout(() => t.remove(), 450) }, ms || 4200);
}

function win(h, b, f, w) { modal('<div class="win-h">' + h + '<button class="x" onclick="closeModal()">✕</button></div><div class="win-b">' + b + '</div>' + (f ? '<div class="win-f">' + f + '</div>' : ''), w) }
function askDo(t, m, l, fn) { window._ask = fn; win(ic('warn', 18) + ' ' + t, '<p style="font-size:13.5px;line-height:1.6">' + m + '</p>', '<button class="btn btn-w" onclick="closeModal()">Cancelar</button><button class="btn btn-red" onclick="closeModal();window._ask()">' + l + '</button>', 480) }
const panel = (t, b) => '<div class="panel"><div class="panel-h">' + t + '</div><div class="panel-b">' + b + '</div></div>';
const kc = (l, v, s, bar, full) => '<div class="kcard"><div class="kl">' + l + '</div><div class="kv">' + v + '</div><div class="ks">' + s + '</div>' + (bar !== undefined ? '<div class="pbar"><i class="' + (full ? 'full' : '') + '" style="width:' + bar + '%"></i></div>' : '') + '</div>';

async function inicializarTurso() {
  setLoad('Creando tablas en Turso...');
  for (const sql of SCHEMA) {
    try { await x(sql); } catch (e) { console.warn('Schema warn:', e.message); }
  }
  setLoad('Verificando usuarios iniciales...');
  const users = await q('SELECT COUNT(*) AS n FROM usuarios');
  if (users[0].n === 0) {
    const seeds = [
      ['admin', 'admin123', 'Lcda. Mariela Quintero', 'A', 'Administradora del Sistema'],
      ['jefe', 'jefe123', 'Gualberto Martinez', 'J', 'Jefe de Comando'],
      ['operador', 'operador123', 'Pedro Rivas', 'O', 'Operador de Sala'],
      ['cdiaz', 'operador123', 'Carmen Díaz', 'O', 'Operadora Territorial']
    ];
    for (const [u, p, n, r, c] of seeds) {
      const h = await hash(p);
      await x('INSERT OR IGNORE INTO usuarios(usuario,clave_hash,nombre,rol,cargo) VALUES(?,?,?,?,?)', [u, h, n, r, c]);
    }
  }
  setLoad('Verificando padrón CNE...');
  const pad = await q('SELECT COUNT(*) AS n FROM padron');
  if (pad[0].n === 0) {
    setLoad('Migrando 479 electores del CNE a Turso...');
    await migrarCNE();
  }
  setLoad('Cargando centros electorales...');
  const cen = await q('SELECT COUNT(*) AS n FROM centros');
  if (cen[0].n === 0) {
    await x('INSERT OR IGNORE INTO centros(codigo,nombre,municipio,parroquia,estado,mesas,cod_estado,cod_municipio,cod_parroquia) VALUES(?,?,?,?,?,?,?,?,?)',
      ['201101030', 'ALDEA COMUNAL JOSE PIEDRA', 'MP. INDEPENDENCIA', 'CM. INDEPENDENCIA', 'EDO. YARACUY', 1, '20', '11', '1']);
  }
  await registrarAct('sys', 'Sistema inicializado · Turso listo', null);
}

async function migrarCNE() {
  const lines = RAW_CNE.split('\n').filter(l => l.trim());
  const batchSize = 50;
  for (let i = 0; i < lines.length; i += batchSize) {
    const batch = lines.slice(i, i + batchSize);
    setLoad('Migrando electores ' + (i + 1) + '–' + Math.min(i + batchSize, lines.length) + ' de ' + lines.length + '...');
    for (const l of batch) {
      const a = l.split(',');
      const letra = a[0] || 'V', ced = normC(a[1]), pa = a[2] || '', sa = a[3] || '', pn = a[4] || '', sn = a[5] || '';
      const sexo = (a[6] || 'F').toUpperCase().startsWith('M') ? 'M' : 'F', fn = (a[7] || '').slice(0, 10);
      const edad = edadDe(fn);
      try {

/* ═══════════ RECARGA DE CACHE DESDE TURSO ═══════════ */
async function refreshAll() {
  CACHE.pad = await q('SELECT * FROM padron ORDER BY p_apellido, p_nombre');
  CACHE.centros = await q('SELECT * FROM centros ORDER BY nombre');
  CACHE.recl = await q('SELECT * FROM reclutadores ORDER BY creado DESC');
  CACHE.act = await q('SELECT a.*, u.nombre AS usuario_nom FROM actividad a LEFT JOIN usuarios u ON u.id = a.usuario_id ORDER BY a.id DESC LIMIT 100');
  CACHE.users = await q('SELECT * FROM usuarios ORDER BY rol, nombre');
  // Enriquecer reclutadores con listas desde asignaciones
  for (const r of CACHE.recl) {
    r.lista = await q('SELECT a.*, p.letra, p.p_apellido, p.s_apellido, p.p_nombre, p.s_nombre, p.sexo, p.fecha_nac, p.edad, p.municipio, p.centro_votacion, p.nombre_cv FROM asignaciones a LEFT JOIN padron p ON p.cedula = a.cedula WHERE a.reclutador_id = ? ORDER BY a.posicion', [r.id]);
  }
}

function padBy(c) { return CACHE.pad.find(p => p.cedula === normC(c)); }
function cenBy(cod) { return CACHE.centros.find(c => c.codigo === String(cod)); }
function nomP(p) { return ((p.p_nombre || '') + ' ' + (p.s_nombre || '')).trim(); }
function apeP(p) { return ((p.p_apellido || '') + ' ' + (p.s_apellido || '')).trim(); }
function asignDe(c) {
  c = normC(c);
  for (const r of CACHE.recl) {
    if (r.cedula === c) return { tipo: 'reclutador', r };
    const i = r.lista.findIndex(l => l.cedula === c);
    if (i > -1) return { tipo: 'integrante', r, pos: i + 1 };
  }
  return null;
}

async function doLogin() {

function donut(elId, items, cNum, cLbl) {
  const tot = items.reduce((a, i) => a + i.v, 0) || 1, C = 2 * Math.PI * 62;
  let acc = 0, seg = '';
  items.forEach((it, i) => {
    const len = C * it.v / tot;
    seg += '<circle cx="80" cy="80" r="62" fill="none" stroke="' + it.c + '" stroke-width="19" stroke-dasharray="0 ' + C + '" data-f="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 80 80)" style="transition:stroke-dasharray .9s ' + (i * .07) + 's"/>';
    acc += len;
  });
  $('ch-' + elId).innerHTML = '<div class="dn-wrap"><svg viewBox="0 0 160 160" class="dn">' + seg + '<text x="80" y="77" text-anchor="middle" class="dn-n">' + cNum + '</text><text x="80" y="96" text-anchor="middle" class="dn-l">' + cLbl + '</text></svg><div class="dn-leg">' + items.map(i => '<div class="lg-it"><span class="dt" style="background:' + i.c + '"></span>' + i.l + '<b>' + i.v + ' · ' + (100 * i.v / tot).toFixed(1) + '%</b></div>').join('') + '</div></div>';
  setTimeout(() => $('ch-' + elId).querySelectorAll('circle').forEach(c => c.setAttribute('stroke-dasharray', c.dataset.f)), 60);
}

  const res = CACHE.pad.filter(p => (cq.length >= 3 && p.cedula.startsWith(cq)) || (nomP(p) + ' ' + apeP(p)).toLowerCase().includes(ql)).slice(0, 6);

    return;

function nrPick(c) { window._nrSel = c; $('nrForm').style.display = 'block'; $('nrSave').disabled = false; $('nrCard').innerHTML = '<div class="row10"><span class="pos">' + ic('id', 14) + '</span><div><b class="mono">' + fC('V', c) + '</b> seleccionada</div></div>' }
async function nrSave() {

async function saveNrManual() {
  const ced = normC($('nrmCed').value), pa = $('nrmPa').value.trim(), pn = $('nrmPn').value.trim();
  if (!/^\d{5,9}$/.test(ced)) return toast('Ingrese una cédula válida (5-9 dígitos)', 'err');
  if (!pa || !pn) return toast('Complete primer apellido y primer nombre', 'err');
  if (padBy(ced)) return toast('La cédula ya existe en el padrón CNE', 'err');
  if (asignDe(ced)) return toast('La cédula ya está asignada como movilizador', 'err');
  const cv = cenBy($('nrmCv').value) || CACHE.centros[0];
  const fn = $('nrmFn').value; const edad = edadDe(fn);
  const letra = $('nrmLet').value, sexo = $('nrmSex').value;
  const tel = $('nrmTel').value.trim(), est = $('nrmEst').value;
  try {
    await x('INSERT INTO padron(cedula,letra,p_apellido,s_apellido,p_nombre,s_nombre,sexo,fecha_nac,edad,codigo_estado,estado,codigo_municipio,municipio,codigo_parroquia,parroquia,centro_votacion,nombre_cv,es_manual) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,1)',
      [ced, letra, pa, $('nrmSa').value.trim(), pn, $('nrmSn').value.trim(), sexo, fn, edad, cv.cod_estado, cv.estado, cv.cod_municipio, cv.municipio, cv.cod_parroquia, cv.parroquia, cv.codigo, cv.nombre]);
    await x('INSERT INTO reclutadores(cedula,telefono,estructura) VALUES(?,?,?)', [ced, tel, est]);
    await registrarAct('user', 'Movilizador creado manual: ' + fC(letra, ced), USER.id);
    await refreshAll(); closeModal(); toast('Movilizador creado en Turso', 'ok');
    const nuevo = CACHE.recl.find(r => r.cedula === ced);
    if (nuevo) { REG.rec = nuevo.id; go('registro') }
  } catch (e) { toast(e.message, 'err') }
}

function tplCSV() { dlCSV('plantilla_padron_cne.csv', [['LETRA_CEDULA', 'CEDULA_IDENTIDAD', 'P_APELLIDO', 'S_APELLIDO', 'P_NOMBRE', 'S_NOMBRE', 'SEXO', 'FECHA_NACIMIENTO', 'CODIGO_ESTADO', 'ESTADO', 'CODIGO_MUNICIPIO', 'MUNICIPIO', 'CODIGO_PARROQUIA', 'PARROQUIA', 'CENTRO_VOTACION', 'NOMBRE_CV'], ['V', '12345678', 'PEREZ', 'GONZALEZ', 'MARIA', 'JOSE', 'F', '1980-05-10', '20', 'EDO. YARACUY', '11', 'MP. INDEPENDENCIA', '1', 'CM. INDEPENDENCIA', '201101030', 'ALDEA COMUNAL JOSE PIEDRA']]); toast('Plantilla descargada', 'ok') }
function parseCSV(txt) {
  const lines = String(txt || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const dl = [';', ',', '\t'].map(d => lines[0].split(d).length);
  const d = [';', ',', '\t'][dl.indexOf(Math.max(...dl))];
  return lines.map(l => l.split(d).map(x => x.replace(/^"|"$/g, '').trim()));
}
function readFile(inp) {
  const f = inp.files[0]; if (!f) return;
  const ext = f.name.split('.').pop().toLowerCase();
  if (['xlsx', 'xls'].includes(ext)) {
    const rd = new FileReader();
    rd.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        processRows(data, f.name);
      } catch (err) { toast('Error al leer Excel: ' + err.message, 'err', 6000) }
    };
    rd.readAsArrayBuffer(f);
  } else {
    const rd = new FileReader();
    rd.onload = () => { processRows(parseCSV(rd.result), f.name) };
    rd.readAsText(f);
  }
  inp.value = '';
}
function processRows(raw, fname) {
  let h = -1;
  for (let i = 0; i < Math.min(raw.length, 5); i++) { const up = raw[i].map(x => String(x).toUpperCase().replace(/\./g, '')); if (up.includes('CEDULA_IDENTIDAD')) { h = i; break } }
  const head = h > -1 ? raw[h].map(x => String(x).toUpperCase().replace(/\./g, '')) : null;
  const idx = n => head ? head.indexOf(n) : -1;
  const ci = idx('CEDULA_IDENTIDAD') > -1 ? idx('CEDULA_IDENTIDAD') : 1;
  const rows = raw.filter((r, i) => i > h && r.some(c => c && String(c).trim())).filter(r => { const c = normC(String(r[ci] || '')); return c.length >= 5 && /^\d+$/.test(c) });
  const get = (r, n, pos) => { const v = idx(n) > -1 ? r[idx(n)] : r[pos]; return v != null ? String(v) : '' };
  const out = []; const cenMap = {};
  rows.forEach(r => {
    const ced = normC(get(r, 'CEDULA_IDENTIDAD', 1)); if (!ced) return;
    out.push({
      letra: get(r, 'LETRA_CEDULA', 0).toUpperCase() || 'V', ced,
      pa: get(r, 'P_APELLIDO', 2), sa: get(r, 'S_APELLIDO', 3),
      pn: get(r, 'P_NOMBRE', 4), sn: get(r, 'S_NOMBRE', 5),
      sexo: get(r, 'SEXO', 6).toUpperCase().startsWith('M') ? 'M' : 'F',
      fn: get(r, 'FECHA_NACIMIENTO', 7).slice(0, 10),
      codEst: get(r, 'CODIGO_ESTADO', 8), estado: get(r, 'ESTADO', 9),
      codMun: get(r, 'CODIGO_MUNICIPIO', 10), mun: get(r, 'MUNICIPIO', 11),
      codPar: get(r, 'CODIGO_PARROQUIA', 12), par: get(r, 'PARROQUIA', 13),
      cvCod: get(r, 'CENTRO_VOTACION', 14), cvNom: get(r, 'NOMBRE_CV', 15)
    });
    if (!cenMap[out[out.length - 1].cvCod]) { cenMap[out[out.length - 1].cvCod] = out[out.length - 1] }
  });
  if (!out.length) { toast('No se encontraron electores válidos en el archivo', 'err', 5000); return }
  const mun = [...new Set(out.map(p => p.mun).filter(Boolean))];
  const par = [...new Set(out.map(p => p.par).filter(Boolean))];
  window._impData = { out, cenMap, fname };
  win(ic('file', 18) + ' Vista previa · ' + esc(fname),
    '<div class="grid g2" style="gap:8px;margin-bottom:10px"><div class="ck-it"><b>' + out.length + '</b><span>Electores</span></div><div class="ck-it"><b>' + Object.keys(cenMap).length + '</b><span>Centros</span></div><div class="ck-it"><b>' + mun.length + '</b><span>Municipios</span></div><div class="ck-it"><b>' + par.length + '</b><span>Parroquias</span></div></div>' +
    '<div style="max-height:260px;overflow-y:auto;border:1px solid var(--line2);border-radius:4px"><table class="tbl"><thead><tr><th>C.I.</th><th>Apellidos</th><th>Nombres</th><th>Edad</th><th>Sexo</th><th>Centro</th><th>Municipio</th></tr></thead><tbody>' + out.slice(0, 15).map(p => '<tr><td class="mono">' + fC(p.letra, p.ced) + '</td><td>' + esc(p.pa + ' ' + p.sa) + '</td><td>' + esc(p.pn + ' ' + p.sn) + '</td><td>' + edadDe(p.fn) + '</td><td>' + p.sexo + '</td><td>' + esc(p.cvNom) + '</td><td>' + esc(p.mun) + '</td></tr>').join('') + (out.length > 15 ? '<tr><td colspan="7" style="text-align:center;color:#999;font-style:italic">... +' + (out.length - 15) + ' registros más</td></tr>' : '') + '</tbody></table></div>',
    '<button class="btn btn-w" onclick="closeModal()">Cancelar</button><button class="btn btn-w" onclick="applyImp(\'merge\')">' + ic('up', 14) + ' Combinar</button><button class="btn btn-navy" onclick="applyImp(\'repl\')">' + ic('up', 14) + ' Reemplazar</button>', 720);
}
function applyImp(modo) {

  } catch (e) {
    setLoad('Error al conectar', e.message);
    $('loading').style.display = 'none';
    $('vLogin').style.display = 'flex';
    $('lgInfo').textContent = 'Error de conexión';
    $('qchips').innerHTML = '<div style="padding:16px;text-align:center"><p style="color:var(--red);font-weight:600;margin-bottom:8px">No se pudo conectar</p><p style="font-size:12.5px;color:var(--mut)">' + esc(e.message) + '</p></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
