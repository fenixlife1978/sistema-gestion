/* ----------- CLIENTE TURSO (v�a API proxy) ----------- */
const API_URL = '/api/turso';
async function turso(stmts) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ statements: Array.isArray(stmts) ? stmts.map(s => ({ q: s.sql || s.q, params: s.args || s.params || [] })) : [{ q: stmts.sql || stmts.q, params: stmts.args || stmts.params || [] }] })
  });
  if (!r.ok) throw new Error('API error ' + r.status);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return Array.isArray(stmts) ? j : j[0];
}
async function q(sql, args = []) {
  const r = await turso({ sql, args });
  if (!r || !r.results) return [];
  const cols = r.results.columns, rows = r.results.rows;
  return rows.map(row => {
    const o = {};
    cols.forEach((c, i) => { o[c] = row[i]; });
    return o;
  });
}
async function x(sql, args = []) { return turso({ sql, args }); }

/* ----------- HASH DE CLAVES (SHA-256 + sal) ----------- */
const SAL = 'c1x10_v1_';
async function hash(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(SAL + pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

    const bd = new Date(y, m - 1, d);

    const now = new Date();

async function refreshAll() {
  CACHE.pad = await q('SELECT * FROM padron ORDER BY p_apellido, p_nombre');
  CACHE.centros = await q('SELECT * FROM centros ORDER BY nombre');
  CACHE.recl = await q('SELECT * FROM reclutadores ORDER BY creado DESC');
  CACHE.act = await q('SELECT a.*, u.nombre AS usuario_nom FROM actividad a LEFT JOIN usuarios u ON u.id = a.usuario_id ORDER BY a.id DESC LIMIT 100');
  CACHE.users = await q('SELECT * FROM usuarios ORDER BY rol, nombre');
  CACHE.cargos = await q('SELECT cc.*, p.letra, p.p_apellido, p.s_apellido, p.p_nombre, p.s_nombre, p.sexo, p.edad, p.nombre_cv FROM centro_cargos cc LEFT JOIN padron p ON p.cedula = cc.cedula ORDER BY cc.centro_codigo, cc.id');
  // Enriquecer reclutadores con listas desde asignaciones
  for (const r of CACHE.recl) {
    r.lista = await q('SELECT a.*, p.letra, p.p_apellido, p.s_apellido, p.p_nombre, p.s_nombre, p.sexo, p.fecha_nac, p.edad, p.municipio, p.centro_votacion, p.nombre_cv FROM asignaciones a LEFT JOIN padron p ON p.cedula = a.cedula WHERE a.reclutador_id = ? ORDER BY a.posicion', [r.id]);
  }
}

function padBy(c) { return CACHE.pad.find(p => p.cedula === normC(c)); }
function cenBy(cod) { return CACHE.centros.find(c => c.codigo === String(cod)); }
function nomP(p) { return ((p.p_nombre || '') + ' ' + (p.s_nombre || '')).trim(); }
function apeP(p) { return ((p.p_apellido || '') + ' ' + (p.s_apellido || '')).trim(); }
function asignDe(c) {
  c = normC(c);
  for (const r of CACHE.recl) {
    if (r.cedula === c) return { tipo: 'reclutador', r };
    const i = r.lista.findIndex(l => l.cedula === c);
    if (i > -1) return { tipo: 'integrante', r, pos: i + 1 };
  }
  return null;
}

async function assignCargo(codigo, idx, cedula, tel, dir) {

      const setProg = (msg, pct) => { progDiv.innerHTML = '<div class="spinner" style="width:44px;height:44px;border:4px solid rgba(255,255,255,.25);border-top-color:#ffca28;border-radius:50%;animation:spin 1s linear infinite"></div><p style="margin-top:16px;font-size:15px;font-weight:600">' + msg + '</p><div style="width:280px;height:8px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:12px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:#ffca28;border-radius:4px;transition:width .3s"></div></div>' };
      closeModal();
      let centroids = Object.values(cenMap).filter(c => !cenBy(c.cvCod));
      if (centroids.length) {
        setProg('Centros electorales...', 0);
        for (let i = 0; i < centroids.length; i += CHUNK) {
          const batch = centroids.slice(i, i + CHUNK).map(c => ({ sql: 'INSERT OR IGNORE INTO centros(codigo,nombre,municipio,parroquia,estado,mesas,cod_estado,cod_municipio,cod_parroquia) VALUES(?,?,?,?,?,?,1,?,?)', args: [c.cvCod, c.cvNom, c.mun, c.par, c.estado, c.codEst, c.codMun, c.codPar] }));
          await turso(batch);
          setProg('Centros electorales... ' + Math.min(i + CHUNK, centroids.length), 5);
        }
        await refreshAll();
      }
      const toAdd = out.filter(p => !padBy(p.ced));
      if (!toAdd.length) { progDiv.remove(); toast('Todos los electores ya existen en el padr�n', 'ok'); return }
      let loaded = 0;
      const total = toAdd.length;
      for (let i = 0; i < total; i += CHUNK) {
        const batch = toAdd.slice(i, i + CHUNK).map(p => ({ sql: 'INSERT OR IGNORE INTO padron(cedula,letra,p_apellido,s_apellido,p_nombre,s_nombre,sexo,fecha_nac,edad,codigo_estado,estado,codigo_municipio,municipio,codigo_parroquia,parroquia,centro_votacion,nombre_cv) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)', args: [p.ced, p.letra, p.pa, p.sa, p.pn, p.sn, p.sexo, p.fn, edadDe(p.fn), p.codEst, p.estado, p.codMun, p.mun, p.codPar, p.par, p.cvCod, p.cvNom] }));
        await turso(batch);
        loaded += batch.length;
        setProg('Cargando electores... ' + loaded + ' / ' + total, Math.round(100 * loaded / total));
      }
      setProg('Carga completa. Actualizando...', 100);
      await registrarAct('sys', 'Padr�n CNE: +' + total + ' nuevos � ' + (fname || ''), USER.id);
      await refreshAll();
      $('hdrInfo').innerHTML = 'Usuario: ' + esc(USER.nombre.toUpperCase()) + ' � <span class="yel">TURSO � ' + CACHE.pad.length + ' electores � ' + CACHE.recl.length + ' movilizadores</span>';
      progDiv.remove();
      toast('? ' + total + ' electores cargados', 'ok', 5000);
      go('dash');
    } catch (e) { const p = document.getElementById('uploadProg'); if (p) p.remove(); toast('Error: ' + e.message, 'err', 8000); console.error(e) }
  })();
}
async function repairEdades() {
  askDo('Reparar edades del padr�n', 'Recalcular� la edad de TODOS los electores bas�ndose en su fecha de nacimiento.', 'Reparar', async () => {
    try {
      const all = await q('SELECT cedula, fecha_nac FROM padron');
      const CHUNK = 200;
      let fixed = 0;
      for (let i = 0; i < all.length; i += CHUNK) {
        const batch = all.slice(i, i + CHUNK).map(p => {
          const nuevaEdad = edadDe(p.fecha_nac);
          return { sql: 'UPDATE padron SET edad = ? WHERE cedula = ?', args: [nuevaEdad, p.cedula] };
        });
        if (batch.length) { await turso(batch); fixed += batch.length; }
      }
      await refreshAll(); renderData(); toast('? ' + fixed + ' edades recalculadas', 'ok', 5000);
    } catch (e) { toast('Error: ' + e.message, 'err', 8000) }
  });
}

/* ----------- SIMULADOR EN VIVO ----------- */
let simT = null;
function startSim() {
  if (simT) return;
  simT = setInterval(async () => {
    if (Math.random() > .6) return;
    const recs = CACHE.recl.filter(r => r.lista.length < 10); if (!recs.length) return;
    const asg = new Set(); CACHE.recl.forEach(r => { asg.add(r.cedula); r.lista.forEach(l => asg.add(l.cedula)) });
    const free = CACHE.pad.filter(p => !asg.has(p.cedula)); if (!free.length) return;
    const r = recs[(Math.random() * recs.length) | 0], p = free[(Math.random() * free.length) | 0];
    try {
      const max = await q('SELECT COALESCE(MAX(posicion),0) AS m FROM asignaciones WHERE reclutador_id = ?', [r.id]);
      await x('INSERT OR IGNORE INTO asignaciones(reclutador_id,cedula,posicion) VALUES(?,?,?)', [r.id, p.cedula, (max[0].m || 0) + 1]);
      await registrarAct('live', 'C.I. ' + fC(p.letra, p.cedula) + ' (' + apeP(p) + ', ' + nomP(p) + ') ? reclutador #' + r.id, USER ? USER.id : null);
      await refreshAll();
      toast('? EN VIVO � ' + fC(p.letra, p.cedula) + ' ? ' + esc(nomP(padBy(r.cedula) || { p_nombre: '' })), 'ok', 3200);
      if (CUR === 'dash') renderDash(); if (CUR === 'registro') renderRegistro(true); if (CUR === 'recl') renderRecl();
    } catch (e) {}
  }, 25000);
}
