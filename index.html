.alert.ok{background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20}.alert.ok .a-ic{background:var(--green)}
.alert.err{background:#ffebee;border-color:#ef9a9a;color:#b71c1c}.alert.err .a-ic{background:var(--red)}
.alert.warn{background:#fff8e1;border-color:#ffe082;color:#8d6e00}.alert.warn .a-ic{background:var(--orange)}
.shake{animation:shake .45s}@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.slots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.slot{width:20px;height:20px;border-radius:3px;border:2px dashed #b6c2cf}

.dn-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.dn{width:150px;flex:none}

.vb{display:flex;align-items:flex-end;gap:12px;height:175px;padding:8px 4px 0}

.win-b{padding:18px}.win-f{background:#e4e8ec;border-top:1px solid var(--line2);padding:10px 16px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

.toast.err{border-left-color:var(--red)}.toast.ok{border-left-color:var(--green)}

.empty{padding:32px;text-align:center;color:var(--mut)}
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.filter-bar>div{min-width:110px;flex:1}
#vLogin{min-height:100vh;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:26px}

/* ----------- CLIENTE TURSO (vía API proxy) ----------- */
const API_URL = '/api/turso';
async function turso(stmts) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ statements: Array.isArray(stmts) ? stmts.map(s => ({ q: s.sql || s.q, params: s.args || s.params || [] })) : [{ q: stmts.sql || stmts.q, params: stmts.args || stmts.params || [] }] })
  });
  if (!r.ok) {
    const txt = await r.text();
    throw new Error('HTTP ' + r.status + ': ' + txt);
  }
  const j = await r.json();
  if (j.error) {
    const errMsg = typeof j.error === 'string' ? j.error : (j.error.message || 'Error Turso');
    throw new Error(errMsg);
  }
  if (Array.isArray(j)) {
    const errItem = j.find(item => item && item.error);
    if (errItem) {
      const msg = typeof errItem.error === 'string' ? errItem.error : (errItem.error.message || 'Error Turso');
      throw new Error(msg);
    }
  }
  return Array.isArray(stmts) ? j : j[0];
}
async function q(sql, args = []) {
  const r = await turso({ sql, args });
  if (!r || !r.results) return [];
  const cols = r.results.columns, rows = r.results.rows;
  return rows.map(row => {
    const o = {};
    cols.forEach((c, i) => { o[c] = row[i]; });
    return o;
  });
}
async function x(sql, args = []) { return turso({ sql, args }); }

/* ----------- HASH DE CLAVES (SHA-256 + sal) ----------- */
const SAL = 'c1x10_v1_';
async function hash(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(SAL + pw));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function parseDate(fn) {
  if (!fn) return null;
  let s = String(fn).trim().replace(/\s+\d{1,2}:\d{2}(:\d{2})?$/, '').replace(/T\d{1,2}:\d{2}(:\d{2})?$/, '');
  if (!s || s === '0' || s === '0000-00-00') return null;
  if (/^\d{3,5}$/.test(s)) {
    const num = parseInt(s, 10);
    if (num >= 1000 && num <= 60000) {
      const ms = (num - 25569) * 86400 * 1000;
      const d = new Date(ms);
      if (!isNaN(d.getTime())) {
        return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() };
      }
    }
  }
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) return { y: parseInt(m[3]), m: parseInt(m[2]), d: parseInt(m[1]) };
  m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if (m) return { y: parseInt(m[1]), m: parseInt(m[2]), d: parseInt(m[3]) };
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2})$/);
  if (m) return { y: 1900 + parseInt(m[3]), m: parseInt(m[2]), d: parseInt(m[1]) };
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (m) return { y: parseInt(m[1]), m: parseInt(m[2]), d: parseInt(m[3]) };
  const b = new Date(s);
  if (!isNaN(b.getTime())) return { y: b.getFullYear(), m: b.getMonth() + 1, d: b.getDate() };
  return null;
}

function edadDe(fn) {
  const o = parseDate(fn);
  if (!o) return 0;
  const now = new Date();
  let e = now.getFullYear() - o.y;
  const diffM = (now.getMonth() + 1) - o.m;
  if (diffM < 0 || (diffM === 0 && now.getDate() < o.d)) e--;
  return (e >= 0 && e <= 120) ? e : 0;
}

function fmtFn(fn) {
  const o = parseDate(fn);

}

function _pdfOpts(title) {

}
function sharePDF(elId, title) {
  const el = document.getElementById(elId);
  if (!el) return;
  if (!navigator.share) { toast('Compartir no soportado en este navegador', 'err'); return }
  const tmp = document.createElement('div');
  tmp.style.cssText = 'position:fixed;left:-9999px;top:0;width:800px;font-family:Roboto,Arial,sans-serif;color:#22303e;background:#fff;padding:24px';
  tmp.innerHTML = _pdfHeader(title) + el.innerHTML + _pdfFooter();
  document.body.appendChild(tmp);

async function migrarActasMesaPartido() {
  try {
    const cols = await q('PRAGMA table_info(actas_mesa)');
    if (!cols.some(c => c.name === 'votos_partido')) {
      await x('ALTER TABLE actas_mesa ADD COLUMN votos_partido INTEGER NOT NULL DEFAULT 0');
    }
  } catch (e) {
    console.warn('Migración actas_mesa.votos_partido:', e.message);
  }
}

async function inicializarTurso() {
  setLoad('Creando tablas en Turso...', 'Preparando estructura de datos...');
  let schemaWarn = 0;
  const schemaErrors = [];
  const isBenignMigrationError = e => {
    const msg = String(e?.message || e || '').toLowerCase();
    return /duplicate column name|already exists|duplicate index|duplicate table/.test(msg);
  };
  await migrarActasMesaPartido();
  for (let i = 0; i < SCHEMA.length; i++) {
    setLoad('Creando tablas en Turso...', 'Paso ' + (i + 1) + ' de ' + SCHEMA.length);
    try {
      await x(SCHEMA[i]);
    } catch (e) {
      if (isBenignMigrationError(e)) {
        schemaWarn++;
        console.warn('Migración ya aplicada:', e.message);
      } else {
        schemaErrors.push({ paso: i + 1, error: String(e?.message || e) });
        console.error('Schema error:', e);
      }
    }
  }
  if (schemaErrors.length) {
    const detalle = schemaErrors.map(x => 'Paso ' + x.paso + ': ' + x.error).join(' | ');
    throw new Error('La estructura de Turso no pudo validarse completamente. ' + detalle);
  }
  setLoad('Verificando usuarios iniciales...', schemaWarn ? ('Estructura lista con ' + schemaWarn + ' avisos de migración') : 'Estructura creada correctamente');
  const users = await q('SELECT COUNT(*) AS n FROM usuarios');
  if (users[0].n === 0) {
    const seeds = [
      ['admin@comando.com', 'admin123', 'Administrador del Sistema', 'A', 'Administrador'],
      ['jefe', 'jefe123', 'Gualberto Martinez', 'J', 'Jefe de Comando'],
      ['operador', 'operador123', 'Pedro Rivas', 'O', 'Operador de Sala'],
      ['cdiaz', 'operador123', 'Carmen Díaz', 'O', 'Operadora Territorial']
    ];
    for (const [u, p, n, r, c] of seeds) {
      const h = await hash(p);
      await x('INSERT OR IGNORE INTO usuarios(usuario,clave_hash,nombre,rol,cargo) VALUES(?,?,?,?,?)', [u, h, n, r, c]);
    }
  }
  for (let i = 0; i < COMITE_PROBLEMAS_BASE.length; i++) {
    const item = COMITE_PROBLEMAS_BASE[i];
    await x('INSERT OR IGNORE INTO catalogo_problemas(categoria,nombre,orden) VALUES(?,?,?)', [item[0], item[1], i + 1]);
  }
  await registrarAct('sys', 'Sistema inicializado • Turso listo', null);
}

  CACHE.pad.forEach(p => { p.edad = edadDe(p.fecha_nac) || p.edad || 0; });

  CACHE.recl = await q('SELECT * FROM reclutadores ORDER BY creado DESC');
  CACHE.act = await q('SELECT a.*, u.nombre AS usuario_nom FROM actividad a LEFT JOIN usuarios u ON u.id = a.usuario_id ORDER BY a.id DESC LIMIT 100');
  CACHE.users = await q('SELECT * FROM usuarios ORDER BY rol, nombre');
  CACHE.cargos = await q('SELECT cc.*, p.letra, p.p_apellido, p.s_apellido, p.p_nombre, p.s_nombre, p.sexo, p.edad, p.nombre_cv FROM centro_cargos cc LEFT JOIN padron p ON p.cedula = cc.cedula ORDER BY cc.centro_codigo, cc.id');
  try {
    CACHE.direccion = await q('SELECT d.id, d.cargo, d.cedula, d.nombre, d.telefono, d.direccion, p.letra, p.p_apellido, p.s_apellido, p.p_nombre, p.s_nombre, p.sexo, p.fecha_nac, p.edad, p.codigo_estado, p.estado, p.codigo_municipio, p.municipio, p.codigo_parroquia, p.parroquia, p.centro_votacion, p.nombre_cv FROM direccion_ejecutiva d LEFT JOIN padron p ON p.cedula = d.cedula ORDER BY d.id DESC');
  } catch (e) {
    console.warn('Fallback CACHE.direccion:', e);
    try { CACHE.direccion = await q('SELECT * FROM direccion_ejecutiva ORDER BY id DESC'); } catch (err) { CACHE.direccion = []; }
  }
  try {
    CACHE.comite = await q('SELECT cv.id, cv.comunidad, cv.cedula, cv.nombre, cv.telefono, cv.direccion, cv.numero_calle, cv.numero_casa, cv.problematica_actual, p.letra, p.p_apellido, p.s_apellido, p.p_nombre, p.s_nombre, p.sexo, p.fecha_nac, p.edad, p.codigo_estado, p.estado, p.codigo_municipio, p.municipio, p.codigo_parroquia, p.parroquia, p.centro_votacion, p.nombre_cv FROM comite_vecinal cv LEFT JOIN padron p ON p.cedula = cv.cedula ORDER BY cv.id DESC');
  } catch (e) {
    console.warn('Fallback CACHE.comite:', e);
    try { CACHE.comite = await q('SELECT * FROM comite_vecinal ORDER BY id DESC'); } catch (err) { CACHE.comite = []; }
  }
  CACHE.catalogoProblemas = await q('SELECT id, categoria, nombre, orden FROM catalogo_problemas WHERE activo = 1 ORDER BY orden, id');
  CACHE.comiteProblemas = await q('SELECT cp.comite_id, cp.problema_id, c.categoria, c.nombre AS problema_nombre FROM comite_problemas cp JOIN catalogo_problemas c ON c.id = cp.problema_id ORDER BY cp.comite_id, c.orden, c.id');
  CACHE.verificacion = await q('SELECT * FROM verificaciones_votacion ORDER BY verificado_en DESC, id DESC');
  CACHE.actasMesa = await q('SELECT * FROM actas_mesa ORDER BY centro_codigo, mesa');
  CACHE.mesasOperativas = await q('SELECT * FROM mesa_operativa ORDER BY centro_codigo, mesa');
  CACHE.mesaMiembros = await q('SELECT * FROM mesa_miembros ORDER BY mesa_operativa_id, id');
  CACHE.cortes = await q('SELECT * FROM cortes_electorales ORDER BY tomado_en DESC, id DESC');
  // Enriquecer reclutadores con listas desde asignaciones
  for (const r of CACHE.recl) {
    r.lista = await q('SELECT a.*, p.letra, p.p_apellido, p.s_apellido, p.p_nombre, p.s_nombre, p.sexo, p.fecha_nac, p.edad, p.municipio, p.centro_votacion, p.nombre_cv FROM asignaciones a LEFT JOIN padron p ON p.cedula = a.cedula WHERE a.reclutador_id = ? ORDER BY a.posicion', [r.id]);
  }
}

function padBy(c) { return CACHE.pad.find(p => p.cedula === normC(c)); }
function cenBy(cod) { return CACHE.centros.find(c => c.codigo === String(cod)); }
function nomP(p) { return ((p.p_nombre || '') + ' ' + (p.s_nombre || '')).trim(); }
function apeP(p) { return ((p.p_apellido || '') + ' ' + (p.s_apellido || '')).trim(); }
function asignDe(c) {
  c = normC(c);
  for (const r of CACHE.recl) {
    if (r.cedula === c) return { tipo: 'reclutador', r };
    const i = r.lista.findIndex(l => l.cedula === c);
    if (i > -1) return { tipo: 'integrante', r, pos: i + 1 };
  }
  return null;
}

function renderDash() {
  const regs = CACHE.recl.reduce((a, r) => a + r.lista.length, 0);
  const cn = CACHE.recl.map(r => r.lista.length);
  const buckets = [cn.filter(x => x === 10).length, cn.filter(x => x >= 7 && x <= 9).length, cn.filter(x => x >= 4 && x <= 6).length, cn.filter(x => x >= 1 && x <= 3).length, cn.filter(x => x === 0).length];
  const M = CACHE.pad.filter(p => p.sexo === 'M').length, F = CACHE.pad.filter(p => p.sexo === 'F').length;
  let edadesValidas = CACHE.pad.filter(p => p.edad > 0 && p.edad <= 120);
  if (CACHE.pad.length > 0 && edadesValidas.length === 0) {
    CACHE.pad.forEach(p => { p.edad = edadDe(p.fecha_nac); });
    edadesValidas = CACHE.pad.filter(p => p.edad > 0 && p.edad <= 120);
    setTimeout(async () => {
      const all = await q('SELECT cedula, fecha_nac FROM padron');
      const CHUNK = 200;
      for (let i = 0; i < all.length; i += CHUNK) {
        const batch = all.slice(i, i + CHUNK).map(p => ({ sql: 'UPDATE padron SET edad = ? WHERE cedula = ?', args: [edadDe(p.fecha_nac), p.cedula] }));
        await turso(batch);
      }
    }, 100);
  }

async function verificarDuplicidadPersona(cedula, contexto = '') {
  const ced = normC(cedula);
  if (!ced) return null;

  const consultas = await Promise.all([
    q('SELECT id, cedula, estructura, direccion FROM reclutadores WHERE cedula = ?', [ced]),
    q('SELECT a.id, a.cedula, a.reclutador_id, a.posicion, r.cedula AS reclutador_cedula, r.estructura FROM asignaciones a LEFT JOIN reclutadores r ON r.id = a.reclutador_id WHERE a.cedula = ?', [ced]),
    q('SELECT id, cargo, cedula FROM direccion_ejecutiva WHERE cedula = ?', [ced]),
    q('SELECT id, comunidad, cedula FROM comite_vecinal WHERE cedula = ?', [ced]),
    q('SELECT id, centro_codigo, cargo, cedula FROM centro_cargos WHERE cedula = ?', [ced])
  ]);

  const encontrados = [];
  if (consultas[0].length) encontrados.push({ tipo: 'MOVILIZADOR', detalle: 'ya está registrado como movilizador.' });
  if (consultas[1].length) {
    const a = consultas[1][0];
    const pRecl = padBy(a.reclutador_cedula);
    const nombreRecl = pRecl ? (nomP(pRecl) + ' ' + apeP(pRecl)).trim() : ('C.I. ' + fC('V', a.reclutador_cedula || ''));
    encontrados.push({
      tipo: 'COMPROMETIDO',
      detalle: 'ya pertenece a la lista de Comprometidos del movilizador ' + nombreRecl + '.',
      reclutador_id: a.reclutador_id,
      reclutador_nombre: nombreRecl,
      posicion: a.posicion
    });
  }
  if (consultas[2].length) {
    const d = consultas[2][0];
    encontrados.push({ tipo: 'DIRECCIÓN EJECUTIVA', detalle: 'ya ocupa el cargo "' + (d.cargo || '') + '" en Dirección Ejecutiva.' });
  }
  if (consultas[3].length) {
    const cv = consultas[3][0];
    encontrados.push({ tipo: 'COMITÉ VECINAL', detalle: 'ya está asignado a la comunidad "' + (cv.comunidad || '') + '".' });
  }
  if (consultas[4].length) {
    const cc = consultas[4][0];
    encontrados.push({ tipo: 'CARGO DE CENTRO', detalle: 'ya ocupa el cargo "' + (cc.cargo || '') + '" en el centro "' + (cc.centro_codigo || '') + '".' });
  }
  if (!encontrados.length) return null;

  const destino = (() => {
    const c = String(contexto || '').toLowerCase();
    if (c.includes('moviliz')) return 'MOVILIZADOR';
    if (c.includes('comprom')) return 'COMPROMETIDO';
    if (c.includes('direccion')) return 'DIRECCIÓN EJECUTIVA';
    if (c.includes('comite')) return 'COMITÉ VECINAL';
    if (c.includes('cargo')) return 'CARGO DE CENTRO';
    return String(contexto || 'OTRO').toUpperCase();
  })();

  const incompatibles = encontrados.filter(d => d.tipo !== destino);
  if (!incompatibles.length) return encontrados[0];

  const detalle = incompatibles.map(d => d.detalle).join(' ');
  const autorizado = await autorizarDuplicidadPersona(ced, destino, incompatibles);
  if (!autorizado) return {
    ...incompatibles[0],
    detalle: detalle + ' Se requiere autorización de Jefe de Comando o Administrador para registrarla además como ' + destino + '.'
  };
  return null;
}

async function autorizarDuplicidadPersona(cedula, destino, encontrados) {
  window.__dupAuthEncontrados = encontrados || [];
  const nombres = (encontrados || []).map(x => x.tipo + ': ' + x.detalle).join('<br>');
  const motivo = 'Duplicidad controlada de persona: ' + (encontrados || []).map(x => x.tipo).join(', ') + ' → ' + destino;
  const auth = await new Promise(resolve => {
    win(ic('lock',18)+' Autorización requerida',
      '<div class="alert warn"><div class="a-ic">!</div><div><b>Esta persona ya figura en otra función del sistema.</b><br>' +
      esc(fC('V', cedula)) + ' requiere autorización para registrarse además como <b>' + esc(destino) + '</b>.<br><br>' +
      '<div style="font-size:12px">' + nombres + '</div>' +
      '<div style="margin-top:8px;color:var(--mut)">La excepción queda auditada y no elimina ni modifica el registro original.</div></div></div>' +
      '<label class="fl" style="margin-top:12px">Usuario autorizante (Jefe o Administrador)</label><input class="inp" id="authUser" autocomplete="username" placeholder="Usuario">' +
      '<label class="fl" style="margin-top:10px">Clave de autorización</label><input class="inp" id="authPass" type="password" autocomplete="current-password" placeholder="Clave">' +
      '<label class="fl" style="margin-top:10px">Motivo</label><textarea class="inp" id="authMotivo" rows="2" placeholder="Indique el motivo de la excepción"></textarea>',
      '<button class="btn btn-w" onclick="window.__dupAuthEncontrados=null;closeModal();window.__authResolve&&window.__authResolve(false)">Cancelar</button><button class="btn btn-navy" onclick="confirmarAutorizacionDuplicidad(\'' + esc(cedula) + '\',\'' + esc(destino) + '\')">Autorizar y continuar</button>',600
    );
    window.__authResolve=resolve;
  });
  return !!auth;
}

async function confirmarAutorizacionDuplicidad(cedula, destino) {
  const encontrados = window.__dupAuthEncontrados || [];
  const u=String($('authUser')?.value||'').trim(), p=$('authPass')?.value||'';
  const motivo=String($('authMotivo')?.value||'').trim();
  if(!u||!p) return toast('Ingrese usuario y clave de autorización','err');
  if(!motivo) return toast('Indique el motivo de la excepción','err');
  try {
    const r=await fetch('/api/duplicidades/autorizar',{
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        cedula:normC(cedula),
        destino:String(destino||'').trim().toUpperCase(),
        autorizante_usuario:u,
        autorizante_clave:p,
        motivo,
        origenes:encontrados.map(x=>x.tipo).filter(Boolean),
        detalles:encontrados.map(x=>x.detalle).filter(Boolean)
      })
    });
    let data={}; try{data=await r.json()}catch(e){}
    if(!r.ok) return toast(data.error||'No se pudo validar la autorización','err',7000);
    const resolve=window.__authResolve; window.__authResolve=null; closeModal();
    if(resolve) resolve(true);
    window.__dupAuthEncontrados=null;
  } catch(e) {
    toast('No se pudo registrar la autorización: '+e.message,'err');
  }
}
async function verificarDuplicidadTelefono(telefono, exclude = {}) {
  const tel = String(telefono || '').replace(/\D/g, '');
  if (!tel) return null;

  const filas = await q(`
    SELECT 'USUARIO' AS origen, id, telefono, NULL AS cedula, nombre AS descripcion FROM usuarios WHERE telefono IS NOT NULL AND telefono != ''
    UNION ALL
    SELECT 'MOVILIZADOR', id, telefono, cedula, estructura FROM reclutadores WHERE telefono IS NOT NULL AND telefono != ''
    UNION ALL
    SELECT 'COMPROMETIDO', a.id, a.telefono, a.cedula, CAST(a.reclutador_id AS TEXT) FROM asignaciones a WHERE a.telefono IS NOT NULL AND a.telefono != ''
    UNION ALL
    SELECT 'DIRECCIÓN EJECUTIVA', id, telefono, cedula, cargo FROM direccion_ejecutiva WHERE telefono IS NOT NULL AND telefono != ''
    UNION ALL
    SELECT 'COMITÉ VECINAL', id, telefono, cedula, comunidad FROM comite_vecinal WHERE telefono IS NOT NULL AND telefono != ''
    UNION ALL
    SELECT 'CARGO DE CENTRO', id, telefono, cedula, cargo FROM centro_cargos WHERE telefono IS NOT NULL AND telefono != ''
  `);
  const found = filas.find(x => {
    if (String(x.telefono || '').replace(/\D/g, '') !== tel) return false;
    return !(exclude.origen && String(x.origen) === String(exclude.origen) && String(x.id) === String(exclude.id));
  });
  return found || null;
}

async function saveNrManual() {
  const ced = normC($('nrmCed').value), pa = $('nrmPa').value.trim(), pn = $('nrmPn').value.trim();
  if (!/^\d{5,9}$/.test(ced)) return toast('Ingrese una cédula válida (5-9 dígitos)', 'err');
  if (!pa || !pn) return toast('Complete primer apellido y primer nombre', 'err');
  const cv = cenBy($('nrmCv').value) || CACHE.centros[0];
  const p = padBy(ced);
  if (p && p.centro_votacion && (p.centro_votacion !== cv.codigo && p.nombre_cv !== cv.nombre)) {
    return toast('⛔ Registro rechazado: La persona C.I. V-' + ced + ' pertenece en el Padrón CNE al centro "' + (p.nombre_cv || p.centro_votacion) + '". No se acepta el registro manual en un centro distinto (' + (cv.nombre || cv.codigo) + ').', 'err', 8000);
  }
  if (p) return toast('La cédula ya existe en el padrón CNE', 'err');
  const dupGlobal = await verificarDuplicidadPersona(ced, 'movilizador');
  if (dupGlobal) return toast(mensajeDuplicidadPersona(ced, dupGlobal), 'err', 8000);
  const fn = $('nrmFn').value; const edad = edadDe(fn);
  const letra = $('nrmLet').value, sexo = $('nrmSex').value;
  const tel = $('nrmTel').value.trim(), est = $('nrmEst').value, dir = $('nrmDir').value.trim();
  if (tel && !valTel(tel)) return toast('Teléfono inválido. Use formato 0XXX-XXXXXXX (11 dígitos)', 'err');
  if (tel) { const dupTel = await verificarDuplicidadTelefono(tel); if (dupTel) return toast(mensajeDuplicidadTelefono(tel, dupTel), 'err', 8000); }
  try {
    await x('INSERT INTO padron(cedula,letra,p_apellido,s_apellido,p_nombre,s_nombre,sexo,fecha_nac,edad,codigo_estado,estado,codigo_municipio,municipio,codigo_parroquia,parroquia,centro_votacion,nombre_cv,es_manual) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,1)',
      [ced, letra, pa, $('nrmSa').value.trim(), pn, $('nrmSn').value.trim(), sexo, fn, edad, cv.cod_estado, cv.estado, cv.cod_municipio, cv.municipio, cv.cod_parroquia, cv.parroquia, cv.codigo, cv.nombre]);
    await x('INSERT INTO reclutadores(cedula,telefono,estructura,direccion) VALUES(?,?,?,?)', [ced, normTel(tel), est, dir]);
    await registrarAct('user', 'Movilizador creado manual: ' + fC(letra, ced), USER.id);
    await refreshAll(); closeModal(); toast('Movilizador creado en Turso', 'ok');
    const nuevo = CACHE.recl.find(r => r.cedula === ced);
    if (nuevo) { REG.rec = nuevo.id; go('registro') }
  } catch (e) { toast(e.message, 'err') }
}

function renderPadron() {
  const prevFocus = _focused();
  const f = PADF;
  const all = CACHE.pad.filter(p => {
    if (f.txt) { const q = f.txt.toLowerCase(), cq = normC(f.txt); if (!((cq.length >= 3 && p.cedula.includes(cq)) || (nomP(p) + ' ' + apeP(p)).toLowerCase().includes(q))) return false }
    if (f.sexo && p.sexo !== f.sexo) return false;
    if (f.centro && p.centro_votacion !== f.centro) return false;
    if (f.e1 && (edadDe(p.fecha_nac) || p.edad || 0) < +f.e1) return false;
    if (f.e2 && (edadDe(p.fecha_nac) || p.edad || 0) > +f.e2) return false;
    return true;
  });
  const per = 14; const pgs = Math.max(1, Math.ceil(all.length / per)); f.pg = Math.min(f.pg, pgs);
  const rows = all.slice((f.pg - 1) * per, f.pg * per);
  $('sec-padron').innerHTML = panel('Padrón CNE / Electores <span class="chip chip-b" style="margin-left:auto">' + all.length + ' registros  Turso</span>',
    '<div class="filter-bar" style="margin-bottom:14px">' +
    '<div style="flex:1;min-width:100px"><label class="fl">Buscar</label><input class="inp" id="padFilter" value="' + esc(f.txt) + '" oninput="PADF.txt=this.value;PADF.pg=1;renderPadron()"></div>' +
    '<div style="min-width:70px"><label class="fl">Sexo</label><select class="inp" onchange="PADF.sexo=this.value;PADF.pg=1;renderPadron()"><option value="">Todos</option><option value="M" ' + (f.sexo === 'M' ? 'selected' : '') + '>M</option><option value="F" ' + (f.sexo === 'F' ? 'selected' : '') + '>F</option></select></div>' +
    '<div style="min-width:80px"><label class="fl">Centro</label><select class="inp" onchange="PADF.centro=this.value;PADF.pg=1;renderPadron()"><option value="">Todos</option>' + CACHE.centros.map(c => '<option value="' + c.codigo + '" ' + (f.centro === c.codigo ? 'selected' : '') + '>' + esc(c.nombre) + '</option>').join('') + '</select></div>' +
    '<div style="max-width:70px"><label class="fl">Edad mín.</label><input class="inp" type="number" value="' + f.e1 + '" onchange="PADF.e1=this.value;PADF.pg=1;renderPadron()"></div>' +
    '<div style="max-width:70px"><label class="fl">Edad máx.</label><input class="inp" type="number" value="' + f.e2 + '" onchange="PADF.e2=this.value;PADF.pg=1;renderPadron()"></div>' +
    '<div style="align-self:end;display:flex;gap:5px;flex-wrap:wrap">' +
    '<button class="btn btn-w btn-xs" onclick="expPadron()">' + ic('dl', 12) + ' CSV</button>' +
    '<button class="btn btn-navy btn-xs" onclick="downloadPDF(\'padronContent\',\'Padrón CNE  Electores\')">' + ic('dl', 12) + ' PDF</button>' +
    '</div></div>' +
    '<div id="padronContent"><table class="tbl"><thead><tr><th>C.I.</th><th>Apellidos</th><th>Nombres</th><th>Edad</th><th>Sexo</th><th>F. Nacimiento</th><th>Centro de votacin</th><th>Municipio / Parroquia</th><th>Estatus compromiso</th></tr></thead><tbody>' +
    (rows.map(p => { const a = asignDe(p.cedula); const ed = edadDe(p.fecha_nac) || p.edad || '-'; const fnStr = fmtFn(p.fecha_nac); return '<tr><td class="mono" style="font-weight:700">' + fC(p.letra, p.cedula) + (p.es_manual ? ' <span class="chip chip-r">MANUAL</span>' : '') + '</td><td>' + esc(apeP(p)) + '</td><td>' + esc(nomP(p)) + '</td><td>' + ed + '</td><td>' + esc(p.sexo || '') + '</td><td class="mono" style="font-size:11px">' + esc(fnStr) + '</td><td style="max-width:190px">' + esc(p.nombre_cv) + ' <span class="mono" style="font-size:10px;color:var(--mut)">' + p.centro_votacion + '</span></td><td>' + esc(p.municipio) + ' / ' + esc(p.parroquia) + '</td><td>' + (a ? (a.tipo === 'reclutador' ? '<span class="chip chip-b">MOVILIZADOR</span>' : '<button class="chip chip-g" style="cursor:pointer" onclick="openRec(' + a.r.id + ')">#' + a.pos + '</button>') : '<span class="chip chip-gr">LIBRE</span>') + '</td></tr>' }).join('') || '<tr><td colspan="9"><div class="empty">Sin resultados.</div></td></tr>') +
    '</tbody></table></div><div class="pager">' + Array.from({ length: Math.min(pgs, 20) }, (_, i) => '<button class="pg' + (i + 1 === f.pg ? ' on' : '') + '" onclick="PADF.pg=' + (i + 1) + ';renderPadron()">' + (i + 1) + '</button>').join('') + (pgs > 20 ? '<span style="align-self:center;color:var(--mut);font-size:12px"> ' + pgs + ' pgs</span>' : '') + '</div>');
  _refocus(prevFocus);
}

function runCargoSearch(codigo, idx) {
  const q = document.getElementById('cargo-q-' + idx).value.trim();
  if (q.length < 2) return;
  const cq = normC(q), ql = q.toLowerCase();
  const res = CACHE.pad.filter(p => (cq.length >= 3 && p.cedula.startsWith(cq)) || (nomP(p) + ' ' + apeP(p)).toLowerCase().includes(ql)).slice(0, 5);
  const box = document.getElementById('cargo-res-' + idx);
  const manualBtn = '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line2)"><button class="btn btn-navy btn-xs" onclick="openCargoManual(\'' + codigo + '\',' + idx + ',\'' + esc(q).replace(/'/g, "\\'") + '\')">' + ic('userPlus', 12) + ' Registrar manualmente y asignar</button></div>';
  box.innerHTML = res.length ? res.map(p => '<button class="rec-sel" onclick="assignCargo(\'' + codigo + '\',' + idx + ',\'' + p.cedula + '\')"><span class="uava">' + ini(nomP(p) + ' ' + apeP(p)) + '</span><span style="flex:1;min-width:0"><b style="font-size:12px">' + esc(apeP(p) + ', ' + nomP(p)) + '</b><div class="mono" style="font-size:10.5px;color:var(--mut)">' + fC(p.letra, p.cedula) + '  ' + (edadDe(p.fecha_nac) || p.edad || '-') + 'a  ' + p.sexo + '</div></span></button>').join('') + manualBtn : '<div style="font-size:12px;color:var(--mut);padding:8px">Sin coincidencias en el padrón</div>' + manualBtn;
}

function openCargoManual(codigo, idx, query) {
  const cargo = CARGOS_CENTRO[idx];
  const isCed = /^\d{5,9}$/.test(normC(query));
  win(ic('userPlus', 18) + ' Registrar y asignar: ' + esc(cargo),
    '<p style="font-size:12px;color:var(--mut);margin-bottom:12px">Complete los datos. La persona se guardará en el padrón y se asignará al cargo.</p>' +
    '<div class="grid g3" style="gap:10px"><div><label class="fl">LETRA_CEDULA</label><select class="inp" id="cmLet"><option>V</option><option>E</option></select></div><div><label class="fl">CDULA *</label><input class="inp mono" id="cmCed" value="' + (isCed ? esc(query) : '') + '" placeholder="12345678"></div><div><label class="fl">SEXO</label><select class="inp" id="cmSex"><option value=""></option><option>F</option><option>M</option></select></div>' +
    '<div><label class="fl">PRIMER APELLIDO *</label><input class="inp" id="cmPa"></div><div><label class="fl">SEGUNDO APELLIDO</label><input class="inp" id="cmSa"></div><div><label class="fl">FECHA NACIMIENTO</label><input class="inp" type="date" id="cmFn"></div>' +
    '<div><label class="fl">PRIMER NOMBRE *</label><input class="inp" id="cmPn"></div><div><label class="fl">SEGUNDO NOMBRE</label><input class="inp" id="cmSn"></div><div><label class="fl">CENTRO VOTACIN</label><select class="inp" id="cmCv">' + CACHE.centros.map(x => '<option value="' + x.codigo + '" ' + (x.codigo === codigo ? 'selected' : '') + '>' + esc(x.nombre) + '</option>').join('') + '</select></div>' +
    '<div><label class="fl">TELÉFONO</label><input class="inp mono" id="cmTel" placeholder="0412-2232523" pattern="0\d{3}-\d{7}" maxlength="12" title="Formato: 0XXX-XXXXXXX (11 dígitos)"></div><div><label class="fl">DIRECCIN</label><input class="inp" id="cmDir" placeholder="Urbanizacin, calle..."></div></div>' +
    '<p style="font-size:11px;color:var(--mut);margin-top:8px">Centro asignado: <b>' + esc(cenBy(codigo).nombre) + '</b></p>',
    '<button class="btn btn-w" onclick="closeModal()">Cancelar</button><button class="btn btn-navy" onclick="saveCargoManual(\'' + codigo + '\',' + idx + ')">Guardar y asignar</button>', 640);
}

async function saveCargoManual(codigo, idx) {
  const ced = normC($('cmCed').value), pa = $('cmPa').value.trim(), pn = $('cmPn').value.trim();
  if (!/^\d{5,9}$/.test(ced)) return toast('Ingrese una cédula válida (5-9 dígitos)', 'err');
  if (!pa || !pn) return toast('Complete primer apellido y primer nombre', 'err');
  const cv = cenBy($('cmCv').value) || cenBy(codigo);
  const dupGlobal = await verificarDuplicidadPersona(ced, 'cargo');
  if (dupGlobal) return toast(mensajeDuplicidadPersona(ced, dupGlobal), 'err', 8000);
  const p = padBy(ced);
  if (p && p.centro_votacion && (p.centro_votacion !== cv.codigo && p.nombre_cv !== cv.nombre)) {
    return toast('⛔ Registro rechazado: La persona C.I. V-' + ced + ' pertenece en el Padrón CNE al centro "' + (p.nombre_cv || p.centro_votacion) + '". No se acepta el registro manual en un centro distinto (' + (cv.nombre || cv.codigo) + ').', 'err', 8000);
  }
  if (p) return toast('La cédula ya existe en el padrón', 'err');
  const fn = $('cmFn').value; const edad = edadDe(fn);
  const letra = $('cmLet').value, sexo = $('cmSex').value;
  const tel = ($('cmTel') ? $('cmTel').value : '').trim(), dir = ($('cmDir') ? $('cmDir').value : '').trim();
  if (tel && !valTel(tel)) return toast('Teléfono inválido. Use formato 0XXX-XXXXXXX (11 dígitos)', 'err');
  if (tel) { const dupTel = await verificarDuplicidadTelefono(tel); if (dupTel) return toast(mensajeDuplicidadTelefono(tel, dupTel), 'err', 8000); }
  try {
    await x('INSERT INTO padron(cedula,letra,p_apellido,s_apellido,p_nombre,s_nombre,sexo,fecha_nac,edad,codigo_estado,estado,codigo_municipio,municipio,codigo_parroquia,parroquia,centro_votacion,nombre_cv,es_manual) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,1)',
      [ced, letra, pa, $('cmSa').value.trim(), pn, $('cmSn').value.trim(), sexo, fn, edad, cv.cod_estado, cv.estado, cv.cod_municipio, cv.municipio, cv.cod_parroquia, cv.parroquia, cv.codigo, cv.nombre]);
    await assignCargo(codigo, idx, ced, normTel(tel), dir);
    await registrarAct('user', 'Alta manual para cargo: ' + fC(letra, ced) + ' ➔ ' + CARGOS_CENTRO[idx], USER.id);
    toast('Elector registrado y asignado al cargo', 'ok');
  } catch (e) { toast(e.message, 'err') }
}

async function assignCargo(codigo, idx, cedula, tel, dir) {
  const cargo = CARGOS_CENTRO[idx];
  tel = tel ? String(tel).trim() : '';
  if (tel && !valTel(tel)) return toast('Teléfono inválido. Use formato 0XXX-XXXXXXX (11 dígitos)', 'err');
  if (tel) { const dupTel = await verificarDuplicidadTelefono(tel); if (dupTel) return toast(mensajeDuplicidadTelefono(tel, dupTel), 'err', 8000); }
  const dupGlobal = await verificarDuplicidadPersona(cedula, 'cargo');
  if (dupGlobal) return toast(mensajeDuplicidadPersona(cedula, dupGlobal), 'err', 8000);
  const p = padBy(cedula);
  const targetCen = cenBy(codigo);
  if (p && p.centro_votacion && (p.centro_votacion !== codigo && p.nombre_cv !== (targetCen ? targetCen.nombre : ''))) {
    return toast('⛔ Asignación rechazada: La persona C.I. ' + fC(p.letra, cedula) + ' está asignada en el Padrón CNE al centro "' + (p.nombre_cv || p.centro_votacion) + '". No se puede asignar a un centro distinto (' + (targetCen ? targetCen.nombre : codigo) + ').', 'err', 8000);
  }
  try {
    const existing = CACHE.cargos.find(c => c.centro_codigo === codigo && c.cargo === cargo);
    if (existing) {
      await x('UPDATE centro_cargos SET cedula = ?, telefono = COALESCE(?, telefono), direccion = COALESCE(?, direccion), asignado_en = datetime(\'now\') WHERE id = ?', [cedula, tel || null, dir || null, existing.id]);
    } else {
      await x('INSERT INTO centro_cargos(centro_codigo, cargo, cedula, telefono, direccion) VALUES(?,?,?,?,?)', [codigo, cargo, cedula, tel || null, dir || null]);
    }
    await registrarAct('user', cargo + ' asignado en centro ' + codigo + ' ? C.I. ' + cedula, USER.id);
    await refreshAll();
    openCentro(codigo);
    toast('Cargo asignado', 'ok');
  } catch (e) { toast(e.message, 'err') }
}

async function removeCargoCentro(codigo, idx) {
  const cargo = CARGOS_CENTRO[idx];
  const existing = CACHE.cargos.find(c => c.centro_codigo === codigo && c.cargo === cargo);
  if (!existing) return;
  try {
    await x('DELETE FROM centro_cargos WHERE id = ?', [existing.id]);
    await registrarAct('user', cargo + ' removido del centro ' + codigo, USER.id);
    await refreshAll();
    openCentro(codigo);
    toast('Cargo removido', 'ok');
  } catch (e) { toast(e.message, 'err') }
}

function openCentro(cod) {
  const c = cenBy(cod); if (!c) return;
  const list = CACHE.pad.filter(p => p.centro_votacion === cod);
  const R = [[18, 25, '18–25'], [26, 35, '26–35'], [36, 45, '36–45'], [46, 55, '46–55'], [56, 65, '56–65'], [66, 999, '66+']];
  const cargos = getCargosCentro(cod);
  const asignados = cargos.filter(k => k.persona).length;
  const cargoRows = cargos.map((k, i) => {
    const p = k.persona;
    const bgColor = i < 6 ? '#f0fdf4' : '#eff6ff';
    const borderColor = i < 6 ? '#a7f3d0' : '#bfdbfe';

    } else {
      return '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px dashed #cbd5e1;border-radius:6px;background:#f8fafc"><div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:700;color:var(--mut)">' + esc(k.cargo) + '</div><div style="font-size:11px;color:var(--mut);font-style:italic">Sin asignar</div></div><button class="btn btn-navy btn-xs" onclick="openCargoSearch(\'' + cod + '\',\'' + esc(k.cargo).replace(/'/g, "\\'") + '\',' + i + ')">' + ic('userPlus', 12) + ' Asignar</button></div><div id="cargo-panel-' + i + '"></div>';
    }
  }).join('');

  win(ic('school', 18) + ' ' + esc(c.nombre),
    '<div class="mono" style="font-size:12px;color:var(--mut);margin-bottom:10px">Código CNE ' + c.codigo + '  ' + esc(c.estado) + '  ' + esc(c.municipio) + '  ' + esc(c.parroquia) + '</div>' +
    '<div class="grid g4" style="margin-bottom:14px"><div class="ck-it"><b>' + list.length + '</b><span>Electores</span></div><div class="ck-it"><b>' + list.filter(p => p.sexo === 'M').length + ' / ' + list.filter(p => p.sexo === 'F').length + '</b><span>M / F</span></div><div class="ck-it"><b>' + list.filter(p => asignDe(p.cedula)).length + '</b><span>Comprometidos</span></div><div class="ck-it"><b>' + (() => { const ev = list.filter(p => { const ed = edadDe(p.fecha_nac) || p.edad; return ed > 0 && ed <= 120; }); return ev.length ? (ev.reduce((a, p) => a + (edadDe(p.fecha_nac) || p.edad || 0), 0) / ev.length).toFixed(0) : ''; })() + '</b><span>Edad prom.</span></div></div>' +
    '<label class="fl">Rango etario del centro</label><div id="ch-cenE"></div>' +
    '<div style="margin-top:12px"><label class="fl">Mesas de votación (editable)</label><div style="display:flex;gap:8px"><input class="inp" type="number" min="1" value="' + (c.mesas || 1) + '" style="max-width:110px" id="cMes"><button class="btn btn-w" onclick="updateMesas(\'' + c.codigo + '\')">Guardar en Turso</button></div></div>' +
    '<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px"><label class="fl" style="font-size:13px;margin-bottom:8px">Cargos del Centro Electoral <span class="chip chip-b">' + asignados + '/14 asignados</span></label><div style="display:grid;gap:8px">' + cargoRows + '</div></div>',
    '<button class="btn btn-w" onclick="closeModal();REPF.centro=\'' + c.codigo + '\';go(\'rep\')">' + ic('chart', 14) + ' Reportes</button><button class="btn btn-navy" onclick="closeModal()">Cerrar</button>', 780);
  vbars('cenE', R.map(r => ({ l: r[2], v: list.filter(p => { const ed = edadDe(p.fecha_nac) || p.edad || 0; return ed >= r[0] && ed <= r[1]; }).length })));
}
async function updateMesas(cod) {
  const v = Number($('cMes')?.value);
  if (!Number.isInteger(v) || v < 1 || v > 999) return toast('La cantidad de mesas debe ser un entero entre 1 y 999', 'err');
  await x('UPDATE centros SET mesas = ? WHERE codigo = ?', [v, cod]);
  await refreshAll(); closeModal(); renderCentros(); toast('Mesas actualizadas', 'ok');
}

/* ----------- REPORTES Y CRUCES ----------- */
function renderRep() {
  const f = REPF;
  const list = CACHE.pad.filter(p => {
    if (f.centro && p.centro_votacion !== f.centro) return false;
    if (f.municipio && p.municipio !== f.municipio) return false;
    if (f.sexo && p.sexo !== f.sexo) return false;
    if (f.e1 && (edadDe(p.fecha_nac) || p.edad || 0) < +f.e1) return false;
    if (f.e2 && (edadDe(p.fecha_nac) || p.edad || 0) > +f.e2) return false;
    return true;
  });
  const R = [[18, 25, '18–25'], [26, 35, '26–35'], [36, 45, '36–45'], [46, 55, '46–55'], [56, 65, '56–65'], [66, 999, '66+']];
  const M = list.filter(p => p.sexo === 'M').length;
  const F = list.filter(p => p.sexo === 'F').length;
  const total = list.length || 1;
  const comprometidos = list.filter(p => asignDe(p.cedula)).length;
  const cobertura = list.length ? (100 * comprometidos / list.length).toFixed(1) : '0.0';
  const edadesVal = list.filter(p => { const ed = edadDe(p.fecha_nac) || p.edad; return ed > 0 && ed <= 120; });
  const edadProm = edadesVal.length ? (edadesVal.reduce((a, p) => a + (edadDe(p.fecha_nac) || p.edad || 0), 0) / edadesVal.length).toFixed(1) : '';
  const edades = R.map(r => ({ l: r[2], v: edadesVal.filter(p => { const ed = edadDe(p.fecha_nac) || p.edad; return ed >= r[0] && ed <= r[1]; }).length }));

  let byC, desg;
  if (f.centro) {
    const g = {}; list.forEach(p => g[p.municipio] = (g[p.municipio] || 0) + 1);
    desg = byC = Object.entries(g).sort((a, b) => b[1] - a[1]).map(([l, v]) => ({ l, v, local: l === (cenBy(f.centro) || {}).municipio }));
  } else {
    const g = {}; list.forEach(p => g[p.nombre_cv] = (g[p.nombre_cv] || 0) + 1);
    byC = Object.entries(g).sort((a, b) => b[1] - a[1]).map(([l, v]) => ({ l, v }));
    const g2 = {}; CACHE.pad.forEach(p => g2[p.municipio] = (g2[p.municipio] || 0) + 1);
    desg = Object.entries(g2).sort((a, b) => b[1] - a[1]).map(([l, v]) => ({ l, v }));
  }

  const munisLista = [...new Set(CACHE.pad.map(p => p.municipio))].sort();
  const maxMuni = Math.max(...desg.map(d => d.v), 1);

  $('sec-rep').innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">' +

      '<div style="display:flex;gap:6px">' +

      '</div></div>' +

    '<div class="filter-bar" style="margin-bottom:14px">' +
      '<div style="flex:1.5;min-width:0"><label class="fl">Centro Electoral</label><select class="inp" onchange="REPF.centro=this.value;renderRep()" style="max-width:220px"><option value=""> TODOS LOS CENTROS </option>' + CACHE.centros.map(c => '<option value="' + c.codigo + '" ' + (f.centro === c.codigo ? 'selected' : '') + '>' + esc(c.nombre) + '</option>').join('') + '</select></div>' +
      '<div style="flex:1;min-width:0"><label class="fl">Municipio</label><select class="inp" onchange="REPF.municipio=this.value;REPF.centro=\'\';renderRep()"><option value=""> TODOS </option>' + munisLista.map(m => '<option value="' + esc(m) + '" ' + (f.municipio === m ? 'selected' : '') + '>' + esc(m) + '</option>').join('') + '</select></div>' +
      '<div style="max-width:90px"><label class="fl">Sexo</label><select class="inp" onchange="REPF.sexo=this.value;renderRep()"><option value="">Todos</option><option value="M" ' + (f.sexo === 'M' ? 'selected' : '') + '>M</option><option value="F" ' + (f.sexo === 'F' ? 'selected' : '') + '>F</option></select></div>' +
      '<div style="min-width:160px"><label class="fl">Rango de Edad</label><div style="display:flex;gap:6px;align-items:center"><input class="inp" type="text" inputmode="numeric" placeholder="Mn" value="' + (f.e1 || '') + '" onchange="REPF.e1=this.value;renderRep()" style="width:70px"><span style="color:var(--mut);font-size:12px;font-weight:600">a</span><input class="inp" type="text" inputmode="numeric" placeholder="Mx" value="' + (f.e2 || '') + '" onchange="REPF.e2=this.value;renderRep()" style="width:70px"></div></div>' +

function parseCSV(txt) {
  const lines = String(txt || '').replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];
  const dl = [';', ',', '\t'].map(d => lines[0].split(d).length);

}
function readFile(inp) {

    };
    rd.readAsArrayBuffer(f);
  } else {
    const rd = new FileReader();
    rd.onload = () => { processRows(parseCSV(rd.result), f.name) };
    rd.readAsText(f);
  }
  inp.value = '';
}
function processRows(raw, fname) {
  let h = -1;
  for (let i = 0; i < Math.min(raw.length, 5); i++) { const up = raw[i].map(x => String(x).toUpperCase().replace(/\./g, '')); if (up.includes('CEDULA_IDENTIDAD')) { h = i; break } }
  const head = h > -1 ? raw[h].map(x => String(x).toUpperCase().replace(/\./g, '')) : null;
  const idx = n => head ? head.indexOf(n) : -1;
  const ci = idx('CEDULA_IDENTIDAD') > -1 ? idx('CEDULA_IDENTIDAD') : 1;
  const rows = raw.filter((r, i) => i > h && r.some(c => c && String(c).trim())).filter(r => { const c = normC(String(r[ci] || '')); return c.length >= 5 && /^\d+$/.test(c) });
  const get = (r, n, pos) => { const v = idx(n) > -1 ? r[idx(n)] : r[pos]; return v != null ? String(v) : '' };
  const normFecha = s => {
    s = String(s || '').trim().replace(/\s+\d{1,2}:\d{2}(:\d{2})?$/, '').replace(/T\d{1,2}:\d{2}(:\d{2})?$/, '');
    if (!s || s === '0') return '';
    let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if (m) return m[3] + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0');
    m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
    if (m) return m[1] + '-' + m[2].padStart(2,'0') + '-' + m[3].padStart(2,'0');
    m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2})$/);
    if (m) return '19' + m[3] + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0');
    m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    return s.slice(0, 10);
  };
  const out = []; const cenMap = {};
  rows.forEach(r => {
    const ced = normC(get(r, 'CEDULA_IDENTIDAD', 1)); if (!ced) return;
    out.push({
      letra: get(r, 'LETRA_CEDULA', 0).toUpperCase() || 'V', ced,
      pa: get(r, 'P_APELLIDO', 2), sa: get(r, 'S_APELLIDO', 3),
      pn: get(r, 'P_NOMBRE', 4), sn: get(r, 'S_NOMBRE', 5),
      sexo: get(r, 'SEXO', 6).toUpperCase().startsWith('M') ? 'M' : 'F',
      fn: normFecha(get(r, 'FECHA_NACIMIENTO', 7)),
      codEst: get(r, 'CODIGO_ESTADO', 8), estado: get(r, 'ESTADO', 9),
      codMun: get(r, 'CODIGO_MUNICIPIO', 10), mun: get(r, 'MUNICIPIO', 11),
      codPar: get(r, 'CODIGO_PARROQUIA', 12), par: get(r, 'PARROQUIA', 13),
      cvCod: get(r, 'CENTRO_VOTACION', 14), cvNom: get(r, 'NOMBRE_CV', 15)
    });
    if (!cenMap[out[out.length - 1].cvCod]) { cenMap[out[out.length - 1].cvCod] = out[out.length - 1] }
  });
  if (!out.length) { toast('No se encontraron electores vlidos en el archivo', 'err', 5000); return }
  const mun = [...new Set(out.map(p => p.mun).filter(Boolean))];
  const par = [...new Set(out.map(p => p.par).filter(Boolean))];

    '<div class="grid g2" style="gap:8px;margin-bottom:10px"><div class="ck-it"><b>' + out.length + '</b><span>Electores</span></div><div class="ck-it"><b>' + Object.keys(cenMap).length + '</b><span>Centros</span></div><div class="ck-it"><b>' + mun.length + '</b><span>Municipios</span></div><div class="ck-it"><b>' + par.length + '</b><span>Parroquias</span></div></div>' +
    '<div style="max-height:260px;overflow-y:auto;border:1px solid var(--line2);border-radius:4px"><table class="tbl"><thead><tr><th>C.I.</th><th>Apellidos</th><th>Nombres</th><th>Edad</th><th>Sexo</th><th>Centro</th><th>Municipio</th></tr></thead><tbody>' + out.slice(0, 15).map(p => '<tr><td class="mono">' + fC(p.letra, p.ced) + '</td><td>' + esc(p.pa + ' ' + p.sa) + '</td><td>' + esc(p.pn + ' ' + p.sn) + '</td><td>' + edadDe(p.fn) + '</td><td>' + p.sexo + '</td><td>' + esc(p.cvNom) + '</td><td>' + esc(p.mun) + '</td></tr>').join('') + (out.length > 15 ? '<tr><td colspan="7" style="text-align:center;color:#999;font-style:italic">... +' + (out.length - 15) + ' registros ms</td></tr>' : '') + '</tbody></table></div>',
    '<button class="btn btn-w" onclick="closeModal()">Cancelar</button><button class="btn btn-navy" onclick="applyImp()">' + ic('up', 14) + ' Cargar al padrón</button>', 720);
}
function applyImp() {
  const { out, cenMap, fname } = window._impData; if (!out) return;

      if (centroids.length) {
        setProg('Centros electorales...', 0);
        for (let i = 0; i < centroids.length; i += CHUNK) {
          const batch = centroids.slice(i, i + CHUNK).map(c => ({ sql: 'INSERT OR IGNORE INTO centros(codigo,nombre,municipio,parroquia,estado,mesas,cod_estado,cod_municipio,cod_parroquia) VALUES(?,?,?,?,?,?,1,?,?)', args: [c.cvCod, c.cvNom, c.mun, c.par, c.estado, c.codEst, c.codMun, c.codPar] }));
          await turso(batch);
          setProg('Centros electorales... ' + Math.min(i + CHUNK, centroids.length), 5);
        }
        await refreshAll();
      }
      const toAdd = out.filter(p => !padBy(p.ced));
      if (!toAdd.length) { progDiv.remove(); toast('Todos los electores ya existen en el padrón', 'ok'); return }
      let loaded = 0;
      const total = toAdd.length;
      for (let i = 0; i < total; i += CHUNK) {
        const batch = toAdd.slice(i, i + CHUNK).map(p => ({ sql: 'INSERT OR IGNORE INTO padron(cedula,letra,p_apellido,s_apellido,p_nombre,s_nombre,sexo,fecha_nac,edad,codigo_estado,estado,codigo_municipio,municipio,codigo_parroquia,parroquia,centro_votacion,nombre_cv) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)', args: [p.ced, p.letra, p.pa, p.sa, p.pn, p.sn, p.sexo, p.fn, edadDe(p.fn), p.codEst, p.estado, p.codMun, p.mun, p.codPar, p.par, p.cvCod, p.cvNom] }));
        await turso(batch);
        loaded += batch.length;
        setProg('Cargando electores... ' + loaded + ' / ' + total, Math.round(100 * loaded / total));
      }
      setProg('Carga completa. Actualizando...', 100);
      await registrarAct('sys', 'Padrón CNE: +' + total + ' nuevos • ' + (fname || ''), USER.id);
      await refreshAll();
      $('hdrInfo').innerHTML = 'Usuario: ' + esc(USER.nombre.toUpperCase()) + ' • <span class="yel">TURSO • ' + CACHE.pad.length + ' electores  ' + CACHE.recl.length + ' movilizadores</span>';
      progDiv.remove();
      toast('? ' + total + ' electores cargados', 'ok', 5000);
      go('dash');
    } catch (e) { const p = document.getElementById('uploadProg'); if (p) p.remove(); toast('Error: ' + e.message, 'err', 8000); console.error(e) }
  })();
}
async function repairEdades() {
  askDo('Reparar edades del padrón', 'Recalcular la edad de TODOS los electores basndose en su fecha de nacimiento.', 'Reparar', async () => {
    try {
      const all = await q('SELECT cedula, fecha_nac FROM padron');
      const CHUNK = 200;
      let fixed = 0;
      for (let i = 0; i < all.length; i += CHUNK) {
        const batch = all.slice(i, i + CHUNK).map(p => {
          const nuevaEdad = edadDe(p.fecha_nac);
          return { sql: 'UPDATE padron SET edad = ? WHERE cedula = ?', args: [nuevaEdad, p.cedula] };
        });
        if (batch.length) { await turso(batch); fixed += batch.length; }
      }
      await refreshAll(); renderData(); toast('? ' + fixed + ' edades recalculadas', 'ok', 5000);
    } catch (e) { toast('Error: ' + e.message, 'err', 8000) }
  });
}

          setLoad('Verificando datos...');

async function saveDirManualFull() {
  const cargoSelect = $('dirCargo');
  const cargo = cargoSelect ? cargoSelect.value.trim() : '';
  if (!cargo) {
    if (cargoSelect) { cargoSelect.style.border = '2px solid var(--red)'; cargoSelect.focus(); }
    return toast('Por favor seleccione un Cargo en el desplegable superior', 'err');
  }

  const ced = normC($('dmCed').value), letra = $('dmLet').value;
  const pa = $('dmPa').value.trim(), sa = $('dmSa').value.trim();
  const pn = $('dmPn').value.trim(), sn = $('dmSn').value.trim();
  const sexo = $('dmSex').value, fn = $('dmFn').value;
  const cvCod = $('dmCv').value;
  const tel = ($('dmTel') ? $('dmTel').value : '').trim();
  const dir = ($('dmDir') ? $('dmDir').value : '').trim();

  if (!/^\d{5,9}$/.test(ced)) return toast('Cédula inválida (debe tener entre 5 y 9 dígitos)', 'err');
  if (!pa || !pn) return toast('Complete el primer apellido y primer nombre', 'err');
  if (tel && !valTel(tel)) return toast('Teléfono inválido. Use formato 0XXX-XXXXXXX', 'err');
  if (tel) { const dupTel = await verificarDuplicidadTelefono(tel); if (dupTel) return toast(mensajeDuplicidadTelefono(tel, dupTel), 'err', 8000); }

  const dupGlobal = await verificarDuplicidadPersona(ced, 'direccion');
  if (dupGlobal) return toast(mensajeDuplicidadPersona(ced, dupGlobal), 'err', 8000);

  const cv = cenBy(cvCod) || CACHE.centros[0] || {};
  const p = padBy(ced);
  if (p && p.centro_votacion && (p.centro_votacion !== cvCod && p.nombre_cv !== cv.nombre)) {
    return toast('⛔ Registro rechazado: La persona C.I. V-' + ced + ' ya pertenece en el Padrón CNE al centro "' + (p.nombre_cv || p.centro_votacion) + '". No se acepta el registro manual en un centro distinto (' + (cv.nombre || cvCod) + ').', 'err', 8000);
  }
  const edad = edadDe(fn);

  try {
    if (!padBy(ced)) {
      await x('INSERT INTO padron(cedula,letra,p_apellido,s_apellido,p_nombre,s_nombre,sexo,fecha_nac,edad,codigo_estado,estado,codigo_municipio,municipio,codigo_parroquia,parroquia,centro_votacion,nombre_cv,es_manual) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,1)',
        [ced, letra, pa, sa, pn, sn, sexo, fn, edad, cv.cod_estado || '20', cv.estado || 'EDO. YARACUY', cv.cod_municipio || '11', cv.municipio || 'MP. INDEPENDENCIA', cv.cod_parroquia || '1', cv.parroquia || 'CM. INDEPENDENCIA', cv.codigo || '', cv.nombre || '']);
    }

    const nomComp = pa + (sa ? ' ' + sa : '') + ', ' + pn + (sn ? ' ' + sn : '');
    await x('DELETE FROM direccion_ejecutiva WHERE cargo = ? OR cedula = ?', [cargo, ced]);
    await x('INSERT INTO direccion_ejecutiva(cargo, cedula, nombre, telefono, direccion) VALUES(?,?,?,?,?)',
      [cargo, ced, nomComp, tel ? normTel(tel) : null, dir || null]);

    await registrarAct('user', 'Alta manual Dirección Ejecutiva: ' + fC(letra, ced) + ' ➔ ' + cargo, USER.id);
    await refreshAll();
    renderDireccion();
    closeModal();
    toast('Registrado exitosamente en Dirección Ejecutiva', 'ok');
  } catch (e) {
    console.error('Error en registro manual Dirección Ejecutiva:', e);
    toast('Error al guardar: ' + e.message, 'err');
  }
}

function filterComiteCards() {

  if (elCom) COMITE_FILTER.comunidad = elCom.value;
  const el = $('comTxt');
  if (el) COMITE_FILTER.txt = el.value;
  const comList = CACHE.comite || [];
  const comunidades = getComunidadesCatalogo();
  const fCom = (COMITE_FILTER.comunidad || '').trim().toLowerCase();
  const fTxt = (COMITE_FILTER.txt || '').trim().toLowerCase();

  const comunidadesVisualizadas = fCom
    ? comunidades.filter(c => c.toLowerCase().includes(fCom))
    : comunidades;

  const cardsHtml = comunidadesVisualizadas.map(comNom => {
    const asig = comList.find(x => String(x.comunidad || '').trim().toUpperCase() === comNom);
    if (asig) {
      const p = padBy(asig.cedula) || asig;
      const nomComp = (p.p_nombre || p.p_apellido) ? (apeP(p) + ', ' + nomP(p)) : (asig.nombre || asig.cedula);
      const letra = p.letra || asig.letra || 'V';
      const ci = fC(letra, asig.cedula);
      const tel = asig.telefono ? asig.telefono : '';
      const dir = asig.direccion ? asig.direccion : '';
      const cvNom = p.nombre_cv || p.centro_votacion || '';
      const munPar = (p.municipio || '') + (p.parroquia ? ' / ' + p.parroquia : '');

      if (fTxt) {
        const fullText = (nomComp + ' ' + ci + ' ' + comNom + ' ' + cvNom + ' ' + tel + ' ' + dir).toLowerCase();
        if (!fullText.includes(fTxt)) return '';
      }

      return '<div class="kcard" style="padding:14px;border-left:4px solid var(--teal);background:#ffffff">' +

function controlCentroActual() {
  return cenBy(CONTROL_ELECTORAL.centro) || CACHE.centros[0] || null;
}
function controlPersonasCentro(codigo) {
  const rows = [];
  const seen = new Set();
  const centro = cenBy(codigo) || {};
  const coincideCentro = p => {
    if (!codigo) return true;
    const pc = String(p?.centro_votacion || '');
    const pn = String(p?.nombre_cv || '');
    return pc === String(codigo) || pn === String(centro.nombre || '');
  };
  const agregar = (cedula, p, meta) => {
    const ced = normC(cedula);
    if (!ced || seen.has(ced) || !coincideCentro(p)) return;
    seen.add(ced);
    rows.push({
      l: { cedula: ced },
      p: p || { cedula: ced },
      reclutador: meta.reclutador || null,
      posicion: meta.posicion || null,
      origen: meta.origen || 'CARGO',
      cargo: meta.cargo || ''
    });
  };

  // 1×10: movilizadores y sus comprometidos.
  for (const r of CACHE.recl || []) {
    const pr = padBy(r.cedula) || r;
    agregar(r.cedula, pr, {
      origen: 'MOVILIZADOR',
      cargo: 'Movilizador',
      reclutador: r
    });
    for (let i = 0; i < (r.lista || []).length; i++) {
      const l = r.lista[i];
      const p = padBy(l.cedula) || l;
      agregar(l.cedula, p, {
        origen: '1×10',
        cargo: 'Comprometido',
        reclutador: r,
        posicion: i + 1
      });
    }
  }

  // Dirección Ejecutiva.
  for (const d of CACHE.direccion || []) {
    const p = padBy(d.cedula) || d;
    agregar(d.cedula, p, {
      origen: 'DIRECCIÓN EJECUTIVA',
      cargo: d.cargo || 'Cargo'
    });
  }

  // Comités Vecinales.
  for (const cv of CACHE.comite || []) {
    const p = padBy(cv.cedula) || cv;
    agregar(cv.cedula, p, {
      origen: 'COMITÉ VECINAL',
      cargo: 'Responsable • ' + (cv.comunidad || 'Comité Vecinal')
    });
  }

  // Cargos asignados directamente a un centro.
  for (const cc of CACHE.cargos || []) {
    if (String(cc.centro_codigo) !== String(codigo)) continue;
    const p = padBy(cc.cedula) || cc;
    agregar(cc.cedula, p, {
      origen: 'CARGO DE CENTRO',
      cargo: cc.cargo || 'Cargo de centro'
    });
  }

  return rows;
}
function controlVerif(cedula) {
  return (CACHE.verificacion || []).find(v => normC(v.cedula) === normC(cedula)) || null;
}
function controlMesaTexto(v) {
  return v ? String(v.mesa || '') : '';
}
function origenRegistroPersona(cedula) {
  const c = normC(cedula);
  const cargo = (CACHE.cargos || []).find(x => normC(x.cedula) === c);
  if (cargo) return 'Cargo de centro: ' + (cargo.cargo || 'Sin cargo');
  const dir = (CACHE.direccion || []).find(x => normC(x.cedula) === c);
  if (dir) return 'Dirección Ejecutiva: ' + (dir.cargo || 'Sin cargo');
  const com = (CACHE.comite || []).find(x => normC(x.cedula) === c);
  if (com) return 'Comité Vecinal: ' + (com.comunidad || 'Sin comunidad');
  const movil = (CACHE.recl || []).find(x => normC(x.cedula) === c);
  if (movil) return 'Movilizador';
  for (const rr of (CACHE.recl || [])) {
    const a = (rr.lista || []).find(x => normC(x.cedula) === c);
    if (a) return '1×10 • ' + nomP(padBy(rr.cedula) || rr);
  }
  return padBy(c) ? 'Padrón CNE' : 'Registro existente';
}

function metricasCorteCentro(codigo) {
  const centro = cenBy(codigo);
  if (!centro) return null;
  const personas = controlPersonasCentro(codigo);
  const verificados = personas.filter(x => !!controlVerif(x.l.cedula));
  const mM = personas.filter(x => x.p.sexo === 'M').length;
  const mF = personas.filter(x => x.p.sexo === 'F').length;
  const vM = verificados.filter(x => x.p.sexo === 'M').length;
  const vF = verificados.filter(x => x.p.sexo === 'F').length;
  const mesas = Math.max(1, Number(centro.mesas || 1));
  const detalle = [];
  for (let i=1;i<=mesas;i++) {
    const mesa=String(i);
    const vv=verificados.filter(x => controlMesaTexto(controlVerif(x.l.cedula))===mesa).length;
    const acta=(CACHE.actasMesa||[]).find(a=>a.centro_codigo===codigo && String(a.mesa)===mesa);
    detalle.push({mesa, verificados:vv, votos_partido:acta ? Number(acta.votos_partido||0) : null, diferencia:acta ? vv-Number(acta.votos_partido||0) : null});
  }
  const actasCargadas=detalle.filter(x=>x.votos_partido!==null).length;
  const totalActa=detalle.reduce((a,x)=>a+(x.votos_partido===null?0:x.votos_partido),0);
  const verifConActa=detalle.filter(x=>x.votos_partido!==null).reduce((a,x)=>a+x.verificados,0);
  return {personas:personas.length,verificados:verificados.length,pendientes:Math.max(0,personas.length-verificados.length),pct:personas.length?verificados.length/personas.length*100:0,mM,mF,vM,vF,mesas,actasCargadas,totalActa,diffTotal:actasCargadas?verifConActa-totalActa:null,detalle};
}

async function crearCorteElectoral(codigo) {
  const met=metricasCorteCentro(codigo);
  if(!met) return toast('Seleccione un centro válido para tomar el corte','err');
  const centro=cenBy(codigo);
  const etiqueta=prompt('Etiqueta del corte (opcional):','Corte '+new Date().toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'}));
  if(etiqueta===null) return;
  try {
    await x('INSERT INTO cortes_electorales(centro_codigo,etiqueta,tomado_en,tomado_por,personas_universo,verificados,pendientes,porcentaje_verificado,masculinos_universo,femeninos_universo,masculinos_verificados,femeninos_verificados,mesas_total,mesas_con_acta,votos_partido_acta,diferencia_acta,detalle_json) VALUES(?,?,datetime("now"),?,?,?,?,?,?,?,?,?,?,?,?,?,?)',[codigo,etiqueta.trim()||null,USER.id,met.personas,met.verificados,met.pendientes,met.pct,met.mM,met.mF,met.vM,met.vF,met.mesas,met.actasCargadas,met.totalActa,met.diffTotal===null?null:met.diffTotal,JSON.stringify(met.detalle)]);
    await registrarAct('corte','Corte de métricas • Centro '+codigo+' • '+(centro?.nombre||'')+' • '+(etiqueta.trim()||'Sin etiqueta'),USER.id);
    await refreshAll(); renderControlElectoral(); toast('Corte registrado correctamente','ok');
  } catch(e){toast('No se pudo guardar el corte: '+e.message,'err',8000);}
}

async function guardarConstitucionMesa(codigo,mesa) {
  const hc=$('mesaHoraConstitucion')?.value||'', hi=$('mesaHoraInicio')?.value||'', test=Number($('mesaTestigos')?.value||0);
  if(test<0||!Number.isInteger(test)) return toast('El número de testigos debe ser un entero no negativo','err');
  try {
    const ex=await q('SELECT id FROM mesa_operativa WHERE centro_codigo=? AND mesa=? LIMIT 1',[codigo,String(mesa)]);
    let id;
    if(ex.length){ id=ex[0].id; await x('UPDATE mesa_operativa SET hora_constitucion=?,hora_inicio_votacion=?,testigos_asistieron=?,actualizado_en=datetime("now"),actualizado_por=? WHERE id=?',[hc||null,hi||null,test,USER.id,id]); }
    else { await x('INSERT INTO mesa_operativa(centro_codigo,mesa,hora_constitucion,hora_inicio_votacion,testigos_asistieron,actualizado_por) VALUES(?,?,?,?,?,?)',[codigo,String(mesa),hc||null,hi||null,test,USER.id]); const z=await q('SELECT id FROM mesa_operativa WHERE centro_codigo=? AND mesa=?',[codigo,String(mesa)]); id=z[0]?.id; }
    if(!id) throw new Error('No se pudo identificar la constitución guardada');
    const checks=[...document.querySelectorAll('.mesaPred:checked')];
    await x('DELETE FROM mesa_miembros WHERE mesa_operativa_id=? AND tipo="AFECTO"',[id]);
    for(const ch of checks) await x('INSERT OR IGNORE INTO mesa_miembros(mesa_operativa_id,cedula,cargo,tipo,origen,autorizado,registrado_por) VALUES(?,?,?,?,?,?,?)',[id,normC(ch.value),ch.dataset.cargo||'Cargo','AFECTO','CENTRO',1,USER.id]);
    await registrarAct('mesa','Constitución Mesa '+mesa+' • Centro '+codigo+' • Hora constitución '+(hc||'N/D')+' • Inicio '+(hi||'N/D')+' • Testigos '+test,USER.id);
    await refreshAll(); closeModal(); renderControlElectoral(); toast('Constitución de Mesa guardada','ok');
  } catch(e){toast('Error guardando constitución: '+e.message,'err',8000);}
}
async function agregarMiembroAccidental(codigo,mesa) {
  const ced=prompt('C.I. de la persona que reemplazará el cargo:');
  if(!ced) return;
  const c=normC(ced); const p=padBy(c);
  const existeEnCargos = [...(CACHE.cargos||[]),...(CACHE.comite||[]),...(CACHE.direccion||[])].some(x=>normC(x.cedula)===c) || (CACHE.recl||[]).some(r=>normC(r.cedula)===c || (r.lista||[]).some(x=>normC(x.cedula)===c));
  if(!p && !existeEnCargos) return toast('La persona debe estar registrada previamente en el sistema','err');
  const cargo=prompt('Cargo que reemplazará en la Mesa:');
  if(!cargo) return;
  const auth=await autorizarOperacion('Reemplazo accidental de cargo en Mesa '+mesa+' • '+cargo);
  if(!auth?.ok) return;
  const mo=mesaOperativa(codigo,mesa);
  if(!mo) return toast('Primero guarde la constitución de la Mesa','err');
  try {
    await x('INSERT INTO mesa_miembros(mesa_operativa_id,cedula,cargo,tipo,origen,autorizado,autorizado_por,autorizado_en,registrado_por) VALUES(?,?,?,?,?,?,?,?,?)',[mo.id,c,cargo,'ACCIDENTAL',origenRegistroPersona(c),1,auth.user.id,new Date().toISOString(),USER.id]);
    await registrarAct('autorizacion','Reemplazo accidental autorizado • C.I. '+c+' • Centro '+codigo+' • Mesa '+mesa+' • Cargo '+cargo+' • Autorizó '+auth.user.nombre,USER.id);
    await refreshAll(); abrirConstitucionMesa(codigo,mesa); toast('Reemplazo autorizado y registrado','ok');
  } catch(e){toast('No se pudo registrar el reemplazo: '+e.message,'err',8000);}
}

async function saveComiteAuto(cedula) {
  cedula = normC(cedula);
  const comSelect = $('comComunidad');
  const comunidad = comSelect ? comSelect.value.trim() : '';
  if (!comunidad) {
    if (comSelect) { comSelect.style.border = '2px solid var(--red)'; comSelect.focus(); }
    return toast('Por favor seleccione una Comunidad en el desplegable superior', 'err');
  }
  const tel = ($('comTel') ? $('comTel').value : '').trim();
  const dir = ($('comDir') ? $('comDir').value : '').trim();
  const nroCalle = ($('comNroCalle') ? $('comNroCalle').value : '').trim();
  const nroCasa = ($('comNroCasa') ? $('comNroCasa').value : '').trim();
  const problematica = ($('comProblematica') ? $('comProblematica').value : '').trim();
  const problemas = selectedComiteProblemas('com');
  if (tel && !valTel(tel)) return toast('Teléfono inválido. Use formato 0XXX-XXXXXXX', 'err');
  if (tel) { const dupTel = await verificarDuplicidadTelefono(tel); if (dupTel) return toast(mensajeDuplicidadTelefono(tel, dupTel), 'err', 8000); }

  const dupGlobal = await verificarDuplicidadPersona(cedula, 'comite');
  if (dupGlobal) return toast(mensajeDuplicidadPersona(cedula, dupGlobal), 'err', 8000);

  const p = padBy(cedula);
  const nomComp = p ? (apeP(p) + ', ' + nomP(p)) : cedula;

  try {
    await x('DELETE FROM comite_vecinal WHERE comunidad = ? OR cedula = ?', [comunidad, cedula]);
    await x('INSERT INTO comite_vecinal(comunidad, cedula, nombre, telefono, direccion, numero_calle, numero_casa, problematica_actual) VALUES(?,?,?,?,?,?,?,?)',
      [comunidad, cedula, nomComp, tel ? normTel(tel) : null, dir || null, nroCalle || null, nroCasa || null, problematica || null]);
    const comRow = await q('SELECT id FROM comite_vecinal WHERE comunidad = ? AND cedula = ? ORDER BY id DESC LIMIT 1', [comunidad, cedula]);
    if (comRow.length) await guardarProblemasComite(comRow[0].id, problemas);
    await registrarAct('user', 'Asignado a Comité Vecinal: ' + nomComp + ' ➔ ' + comunidad, USER.id);
    await refreshAll();
    renderComite();
    closeModal();
    toast('Comité Vecinal asignado a "' + comunidad + '" exitosamente', 'ok');
  } catch (e) {
    console.error('Error guardando Comité Vecinal:', e);
    toast('Error al guardar: ' + e.message, 'err');
  }
}

async function saveComiteManualFull() {
  const comSelect = $('comComunidad');
  const comunidad = comSelect ? comSelect.value.trim() : '';
  if (!comunidad) {
    if (comSelect) { comSelect.style.border = '2px solid var(--red)'; comSelect.focus(); }
    return toast('Por favor seleccione una Comunidad en el desplegable superior', 'err');
  }

  const ced = normC($('cmCed').value), letra = $('cmLet').value;
  const pa = $('cmPa').value.trim(), sa = $('cmSa').value.trim();
  const pn = $('cmPn').value.trim(), sn = $('cmSn').value.trim();
  const sexo = $('cmSex').value, fn = $('cmFn').value;
  const cvCod = $('cmCv').value;
  const tel = ($('cmTel') ? $('cmTel').value : '').trim();
  const dir = ($('cmDir') ? $('cmDir').value : '').trim();
  const nroCalle = ($('cmNroCalle') ? $('cmNroCalle').value : '').trim();
  const nroCasa = ($('cmNroCasa') ? $('cmNroCasa').value : '').trim();
  const problematica = ($('cmProblematica') ? $('cmProblematica').value : '').trim();
  const problemas = selectedComiteProblemas('cm');

  if (!/^\d{5,9}$/.test(ced)) return toast('Cédula inválida (debe tener entre 5 y 9 dígitos)', 'err');
  if (!pa || !pn) return toast('Complete el primer apellido y primer nombre', 'err');
  if (tel && !valTel(tel)) return toast('Teléfono inválido. Use formato 0XXX-XXXXXXX', 'err');
  if (tel) { const dupTel = await verificarDuplicidadTelefono(tel); if (dupTel) return toast(mensajeDuplicidadTelefono(tel, dupTel), 'err', 8000); }

  const dupGlobal = await verificarDuplicidadPersona(ced, 'comite');
  if (dupGlobal) return toast(mensajeDuplicidadPersona(ced, dupGlobal), 'err', 8000);

  const cv = cenBy(cvCod) || CACHE.centros[0] || {};
  const p = padBy(ced);
  if (p && p.centro_votacion && (p.centro_votacion !== cvCod && p.nombre_cv !== cv.nombre)) {
    return toast('⛔ Registro rechazado: La persona C.I. V-' + ced + ' ya pertenece en el Padrón CNE al centro "' + (p.nombre_cv || p.centro_votacion) + '". No se acepta el registro manual en un centro distinto (' + (cv.nombre || cvCod) + ').', 'err', 8000);
  }
  const edad = edadDe(fn);

  try {
    if (!padBy(ced)) {
      await x('INSERT INTO padron(cedula,letra,p_apellido,s_apellido,p_nombre,s_nombre,sexo,fecha_nac,edad,codigo_estado,estado,codigo_municipio,municipio,codigo_parroquia,parroquia,centro_votacion,nombre_cv,es_manual) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,1)',
        [ced, letra, pa, sa, pn, sn, sexo, fn, edad, cv.cod_estado || '20', cv.estado || 'EDO. YARACUY', cv.cod_municipio || '11', cv.municipio || 'MP. INDEPENDENCIA', cv.cod_parroquia || '1', cv.parroquia || 'CM. INDEPENDENCIA', cv.codigo || '', cv.nombre || '']);
    }

    const nomComp = pa + (sa ? ' ' + sa : '') + ', ' + pn + (sn ? ' ' + sn : '');
    await x('DELETE FROM comite_vecinal WHERE comunidad = ? OR cedula = ?', [comunidad, ced]);
    await x('INSERT INTO comite_vecinal(comunidad, cedula, nombre, telefono, direccion, numero_calle, numero_casa, problematica_actual) VALUES(?,?,?,?,?,?,?,?)',
      [comunidad, ced, nomComp, tel ? normTel(tel) : null, dir || null, nroCalle || null, nroCasa || null, problematica || null]);

    const comRow = await q('SELECT id FROM comite_vecinal WHERE comunidad = ? AND cedula = ? ORDER BY id DESC LIMIT 1', [comunidad, ced]);
    if (comRow.length) await guardarProblemasComite(comRow[0].id, problemas);
    await registrarAct('user', 'Alta manual Comité Vecinal: ' + fC(letra, ced) + ' ➔ ' + comunidad, USER.id);
    await refreshAll();
    renderComite();
    closeModal();
    toast('Registrado exitosamente en Comité Vecinal', 'ok');
  } catch (e) {
    console.error('Error en registro manual Comité Vecinal:', e);
    toast('Error al guardar: ' + e.message, 'err');
  }
}

  const problemas = selectedComiteProblemas('comE');
  if (tel && !valTel(tel)) return toast('Teléfono inválido. Use formato 0XXX-XXXXXXX', 'err');
  if (tel) { const dupTel = await verificarDuplicidadTelefono(tel, {origen:'COMITÉ VECINAL', id}); if (dupTel) return toast(mensajeDuplicidadTelefono(tel, dupTel), 'err', 8000); }
  try {
    await x('UPDATE comite_vecinal SET telefono = ?, direccion = ?, numero_calle = ?, numero_casa = ?, problematica_actual = ? WHERE id = ?',
      [tel ? normTel(tel) : null, dir || null, nroCalle || null, nroCasa || null, problematica || null, id]);
    await guardarProblemasComite(id, problemas);
    await refreshAll(); renderComite(); closeModal(); toast('Actualizado con éxito', 'ok');
  } catch (e) { toast('Error: ' + e.message, 'err'); }
}

function getComiteListadoCompleto() {
  const asignados = CACHE.comite || [];
  const porComunidad = new Map();
  asignados.forEach(r => {
    if (r && r.comunidad) porComunidad.set(String(r.comunidad).trim().toUpperCase(), r);
  });

  return getComunidadesCatalogo().map((comunidad, i) => {
    const asignado = porComunidad.get(String(comunidad).trim().toUpperCase()) || null;
    const p = asignado ? (padBy(asignado.cedula) || asignado) : {};
    return {
      nro: i + 1,
      comunidad,
      asignado,
      p,
      estado: asignado ? 'ASIGNADO' : 'SIN ASIGNAR'
    };
  });
}

function datosComiteFila(item) {
  const x = item.asignado;
  const p = item.p || {};
  const ci = x ? fC(p.letra || x.letra || 'V', x.cedula) : '';
  const pa = p.p_apellido || '';
  const sa = p.s_apellido || '';
  const pn = p.p_nombre || '';
  const sn = p.s_nombre || '';
  const nombre = x ? (x.nombre || ((pa || sa) ? (apeP(p) + ', ' + nomP(p)) : x.cedula)) : '';
  const edad = x ? ((edadDe(p.fecha_nac) || (p.edad !== undefined && p.edad !== null ? p.edad : '')) || '') : '';
  const sexo = x ? (p.sexo || '') : '';
  const fn = x ? fmtFn(p.fecha_nac) : '';
  const cv = x ? (p.nombre_cv || p.centro_votacion || '') : '';
  const munPar = x ? ((p.municipio || '') + (p.parroquia ? ' / ' + p.parroquia : '')) : '';
  const tel = x ? (x.telefono || p.telefono || '') : '';
  const dir = x ? (x.direccion || p.direccion || '') : '';
  const nroCalle = x ? (x.numero_calle || '') : '';
  const nroCasa = x ? (x.numero_casa || '') : '';
  const legacyProblem = x ? (x.problematica_actual || '') : '';
  const catalogProblems = x ? problemasTextoComite(x.id) : '';
  const problematica = [catalogProblems, legacyProblem ? 'Observación: ' + legacyProblem : ''].filter(Boolean).join(' • ');
  return { ci, pa, sa, pn, sn, nombre, edad, sexo, fn, cv, munPar, tel, dir, nroCalle, nroCasa, problematica };
}
