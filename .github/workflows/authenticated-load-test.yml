name: authenticated-load-test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Vercel production URL to test"
        required: false
        default: "https://gestion-erp-electoral.vercel.app"
        type: string
      duration:
        description: "Seconds per load level"
        required: true
        default: "30"
        type: string
      confirm_production_load:
        description: "Type RUN-PRODUCTION-LOAD to authorize real production load"
        required: true
        default: ""
        type: string

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Stable production alias. Unlike a deployment-specific *.vercel.app
      # URL, this follows the current production deployment automatically.
      BASE_URL: ${{ inputs.base_url || 'https://gestion-erp-electoral.vercel.app' }}
      LOGIN_USER: ${{ secrets.LOAD_TEST_USER }}
      LOGIN_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
      LOGIN_ROLE: ${{ secrets.LOAD_TEST_ROLE }}
      LOAD_TEST_USERS_JSON: ${{ secrets.LOAD_TEST_USERS_JSON }}
      LOAD_TEST_CENTRO: ${{ secrets.LOAD_TEST_CENTRO }}
      LOAD_TEST_CEDULA: ${{ secrets.LOAD_TEST_CEDULA }}
      LOAD_TEST_MESA: ${{ secrets.LOAD_TEST_MESA }}
      DURATION: ${{ inputs.duration || '120' }}
      SESSION_COOKIES_FILE: load-test-sessions.json
    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify test prerequisites
        run: |
          test "${{ inputs.confirm_production_load }}" = "RUN-PRODUCTION-LOAD"
          test -n "$LOAD_TEST_CENTRO"
          test -n "$LOAD_TEST_CEDULA"
          test -n "$LOAD_TEST_MESA"
          test -n "$BASE_URL"
          test -n "$LOGIN_USER"
          test -n "$LOGIN_PASSWORD"
          test -n "$LOGIN_ROLE"
          node --version
          echo "Testing commit: $(git rev-parse HEAD)"
          echo "Target production URL: $BASE_URL"

      - name: Wait for current production deployment
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$BASE_URL/api/health" >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Production deployment not ready yet (attempt $i/30)"
            sleep 10
          done
          echo "Production health endpoint did not become ready in 5 minutes"
          exit 1

      - name: Create 400 independent authenticated sessions
        shell: bash
        run: |
          rm -f "$SESSION_COOKIES_FILE"
          USERS=400 BASE_URL="$BASE_URL" LOGIN_USER="$LOGIN_USER" LOGIN_PASSWORD="$LOGIN_PASSWORD" LOGIN_ROLE="$LOGIN_ROLE" LOAD_TEST_USERS_JSON="$LOAD_TEST_USERS_JSON" SESSION_COOKIES_FILE="$SESSION_COOKIES_FILE" node scripts/create-load-test-sessions.mjs
          test -s "$SESSION_COOKIES_FILE"
          COUNT="$(node -e 'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync(process.env.SESSION_COOKIES_FILE,"utf8")).length)' )"
          test "$COUNT" -ge 400
          echo "Independent authenticated sessions created: $COUNT"

      - name: Load 50 users
        run: |
          set -o pipefail
          USERS=50 SESSION_COOKIES_FILE="$SESSION_COOKIES_FILE" BASE_URL="$BASE_URL" DURATION="$DURATION" SCENARIO=election LOAD_TEST_CENTRO="$LOAD_TEST_CENTRO" LOAD_TEST_CEDULA="$LOAD_TEST_CEDULA" LOAD_TEST_MESA="$LOAD_TEST_MESA" node scripts/load-test.mjs | tee load-50.log

      - name: Load 100 users
        run: |
          set -o pipefail
          USERS=100 SESSION_COOKIES_FILE="$SESSION_COOKIES_FILE" BASE_URL="$BASE_URL" DURATION="$DURATION" SCENARIO=election LOAD_TEST_CENTRO="$LOAD_TEST_CENTRO" LOAD_TEST_CEDULA="$LOAD_TEST_CEDULA" LOAD_TEST_MESA="$LOAD_TEST_MESA" node scripts/load-test.mjs | tee load-100.log

      - name: Load 150 users
        run: |
          set -o pipefail
          USERS=150 SESSION_COOKIES_FILE="$SESSION_COOKIES_FILE" BASE_URL="$BASE_URL" DURATION="$DURATION" SCENARIO=election LOAD_TEST_CENTRO="$LOAD_TEST_CENTRO" LOAD_TEST_CEDULA="$LOAD_TEST_CEDULA" LOAD_TEST_MESA="$LOAD_TEST_MESA" node scripts/load-test.mjs | tee load-150.log

      - name: Load 200 users
        run: |
          set -o pipefail
          USERS=200 SESSION_COOKIES_FILE="$SESSION_COOKIES_FILE" BASE_URL="$BASE_URL" DURATION="$DURATION" SCENARIO=election LOAD_TEST_CENTRO="$LOAD_TEST_CENTRO" LOAD_TEST_CEDULA="$LOAD_TEST_CEDULA" LOAD_TEST_MESA="$LOAD_TEST_MESA" node scripts/load-test.mjs | tee load-200.log

      - name: Load 300 users
        run: |
          set -o pipefail
          USERS=300 SESSION_COOKIES_FILE="$SESSION_COOKIES_FILE" BASE_URL="$BASE_URL" DURATION="$DURATION" SCENARIO=election LOAD_TEST_CENTRO="$LOAD_TEST_CENTRO" LOAD_TEST_CEDULA="$LOAD_TEST_CEDULA" LOAD_TEST_MESA="$LOAD_TEST_MESA" node scripts/load-test.mjs | tee load-300.log

      - name: Load 400 users
        run: |
          set -o pipefail
          USERS=400 SESSION_COOKIES_FILE="$SESSION_COOKIES_FILE" BASE_URL="$BASE_URL" DURATION="$DURATION" SCENARIO=election LOAD_TEST_CENTRO="$LOAD_TEST_CENTRO" LOAD_TEST_CEDULA="$LOAD_TEST_CEDULA" LOAD_TEST_MESA="$LOAD_TEST_MESA" node scripts/load-test.mjs | tee load-400.log

      - name: Upload load-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: election-load-test-results
          path: |
            load-50.log
            load-100.log
            load-150.log
            load-200.log
            load-300.log
            load-400.log
          if-no-files-found: warn
