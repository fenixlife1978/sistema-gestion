name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'electron/**'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run dist:win

      - name: Publish installer as a GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-build-${{ github.run_number }}
          name: Sistema de Gestión Electoral - Compilación ${{ github.run_number }}
          body: Instalador de Windows x64 generado automáticamente desde main. Compilación ${{ github.sha }}.
          prerelease: true
          files: dist/*.exe
