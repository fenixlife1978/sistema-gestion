name: Index JavaScript Syntax Check
on:
  push:
    branches: [audit/hardening-2026-09-19]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract inline JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const start=h.indexOf('<script>');
          const end=h.lastIndexOf('</script>');
          if(start<0 || end<start) throw new Error('Inline script block not found');
          fs.writeFileSync('/tmp/index-inline.js',h.slice(start+8,end));
          console.log('Extracted inline JavaScript:', end-(start+8), 'bytes');
          NODE
      - name: Check syntax
        run: node --check /tmp/index-inline.js
